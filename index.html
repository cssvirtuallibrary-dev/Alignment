  // proper falling-raindrop silhouette: a rounded, flattened leading belly
  // (the side facing the direction of travel) tapering to a fine trailing
  // point (the side facing backward, i.e. "up"), like a real drop of water
  // stretched by its own fall — plus a small bright catch-light highlight
  // for a wet, glossy look.
  function buildWaterDropGeometry(radius){
    const pts = [
      new THREE.Vector2(0.00, 1.00),   // trailing tip (points backward/up)
      new THREE.Vector2(0.14, 0.68),
      new THREE.Vector2(0.32, 0.30),
      new THREE.Vector2(0.46, -0.05),
      new THREE.Vector2(0.42, -0.42),
      new THREE.Vector2(0.24, -0.75),
      new THREE.Vector2(0.00, -0.95)   // rounded leading belly (faces direction of travel)
    ].map(p => new THREE.Vector2(p.x*radius, p.y*radius));
    const geo = new THREE.LatheGeometry(pts, 24);
    geo.computeVertexNormals();
    return geo;
  }
  const dropMat = new THREE.MeshPhysicalMaterial({ color:0xbfe9ff, transmission:0.92, roughness:0.03, thickness:0.22, ior:1.33, transparent:true, opacity:0, clearcoat:1.0, clearcoatRoughness:0.05 });
  const dropMesh = new THREE.Mesh(buildWaterDropGeometry(0.07), dropMat);
  // Orient the drop so its trailing tip points opposite the direction of
  // travel (i.e. "backward/up"), and its rounded belly leads the fall —
  // exactly like a real drop of water dropping down.
  const dropTravelDir = new THREE.Vector3().subVectors(DROP_END, DROP_START).normalize();
  dropMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dropTravelDir.clone().negate());
  group.add(dropMesh);
  const dropHighlightMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0 });
  const dropHighlight = new THREE.Mesh(new THREE.SphereGeometry(0.014, 10, 10), dropHighlightMat);
  dropHighlight.position.set(0.022, 0.022, 0.02);
  dropMesh.add(dropHighlight);
  const dropLight = new THREE.PointLight(0xaee3ff, 0, 1.2);
  group.add(dropLight);

  // 4 stems, each pre-split into short segments along a curve from YA out
  // to its compass target, so "growth" is revealed by toggling segment
  // visibility (no per-frame geometry rebuilds needed).
  const STEM_SEGMENTS = 14;
  // Per request: stem made SMALLER (thinner cylinders) and a darker,
  // earthier green/brown color (was a bright, pure green 0x2e7d32) --
  // 0x3a3420 is a dark, muted olive-brown, more like a woody/aged stem.
  const stemMat = new THREE.MeshStandardMaterial({ color:0x3a3420, roughness:0.65, metalness:0.05 });
  // Winds each stem's growth path spirally around the scene's central
  // vertical (Z) axis (like a vine circling the Buddha's own centerline as
  // it climbs), rather than twisting around its own local YA -> flower
  // axis. Implemented as a pure rotation of each point's (x, y) around the
  // Z axis, with the rotation angle fading to zero at both endpoints —
  // this keeps the stem's start (YA, which already sits on the Z axis) and
  // end (the flower's exact position) unchanged, while the middle of the
  // path sweeps around the center.
  const STEM_SPIRAL_TURNS = 0.05; // ~1/20 turn corkscrew twist at the peak of the smooth sine sweep
  function applySpiralAroundCentralAxis(points){
    return points.map((p, i) => {
      const tt = i / (points.length - 1);
      const angle = STEM_SPIRAL_TURNS * Math.PI * 2 * Math.sin(Math.PI * tt); // 0 at both ends, peaks mid-path
      const cos = Math.cos(angle), sin = Math.sin(angle);
      return new THREE.Vector3(p.x * cos - p.y * sin, p.x * sin + p.y * cos, p.z);
    });
  }
  const stems = PETAL_SPECS.map(spec => {
    // Direct growth path from YA out to this flower's position, but with
    // the final approach rising straight up (Z-up) into the flower's base
    // -- like a real stem growing upward into its blossom -- rather than
    // curving in flat/sideways from the side.
    const mid = new THREE.Vector3().lerpVectors(YA_POS, spec.target, 0.42);
    mid.z += 0.12; // gentle natural arch through the middle of the path
    const preTarget = spec.target.clone();
    preTarget.z -= 0.32; // approach point directly below the flower
    const curve = new THREE.CatmullRomCurve3([
      YA_POS.clone(),
      mid,
      preTarget,
      spec.target.clone()
    ]);
    const points = applySpiralAroundCentralAxis(curve.getPoints(STEM_SEGMENTS));
    const segMeshes = [];
    for (let i=0; i<STEM_SEGMENTS; i++){
      const a = points[i], b = points[i+1];
      const dir = new THREE.Vector3().subVectors(b, a);
      const len = dir.length() || 0.001;
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.015, len, 8), stemMat); // thinner (smaller) stem, was 0.018/0.022
      cyl.position.copy(a).addScaledVector(dir, 0.5);
      cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
      cyl.visible = false;
      group.add(cyl);
      segMeshes.push(cyl);
    }
    return segMeshes;
  });

  // 4 flowers (Hoa Sen.stl, each tinted its own color) blooming at the
  // compass targets: BLUE @ -X, RED @ -Y, PURPLE @ +X, WHITE @ +Y.
  const flowers = PETAL_SPECS.map(spec => {
    const f = buildLotusFlowerGroup([spec.color]);
    f.group.position.copy(spec.target);
    group.add(f.group);
    return { ...f, homePos: spec.target.clone() };
  });

  // Merged multi-color lotus (8 stacked Hoa Sen.stl copies with a naturally
  // blended palette) that blooms at the heart center once the 4 flowers
  // spiral inward and combine.
  const mergedColors = buildNaturalMergedPalette();
  const mergedFlower = buildLotusFlowerGroup(mergedColors);
  mergedFlower.group.position.copy(HEART_POS);
  mergedFlower.group.scale.setScalar(0.001);
  group.add(mergedFlower.group);

  // ---- Timeline (seconds); loops seamlessly via elapsed % CYCLE ----
  const T_YA_IN        = [0.0, 1.0];
  const T_SA_IN        = [1.0, 2.0];
  const T_DROP         = [2.2, 4.2];
  const T_STEM_GROW    = [4.6, 7.2];
  const T_FLOWER_BLOOM = [6.2, 8.4];
  const T_MERGE        = [9.0, 11.4];
  const T_MERGED_BLOOM = [11.0, 12.6];
  const T_VA_IN        = [12.6, 13.6];
  const CYCLE = 16.5;

  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const smooth = (x) => x*x*(3-2*x);
  const progressOf = (t, span) => clamp01((t - span[0]) / (span[1] - span[0]));
  const lerp = (a, b, k) => a + (b - a) * k;

  function update(elapsedRaw){
    const t = elapsedRaw % CYCLE;

    const yaOpacity = smooth(progressOf(t, T_YA_IN));
    yaSprite.material.opacity = yaOpacity;
    yaMarker.mat.opacity = yaOpacity * 0.9; yaMarker.light.intensity = yaOpacity * 1.1;
    const saOpacity = smooth(progressOf(t, T_SA_IN));
    saSprite.material.opacity = saOpacity;
    saMarker.mat.opacity = saOpacity * 0.9; saMarker.light.intensity = saOpacity * 1.1;

    const dp = progressOf(t, T_DROP);
    const dropActive = t >= T_DROP[0] && t <= T_DROP[1] + 0.15;
    dropMat.opacity = dropActive ? (dp < 0.92 ? 0.95 : lerp(0.95, 0, (dp-0.92)/0.08)) : 0;
    dropHighlightMat.opacity = dropMat.opacity * 0.9;
    dropLight.intensity = dropActive ? 1.1 * (1 - Math.abs(dp-0.5)*0.6) : 0;
    if (dropActive){
      dropMesh.position.lerpVectors(DROP_START, DROP_END, smooth(dp));
      dropLight.position.copy(dropMesh.position);
    }

    const sp = progressOf(t, T_STEM_GROW);
    const segCount = Math.round(sp * STEM_SEGMENTS);
    const stemsShouldShow = t < T_MERGE[0]; // stems disappear once the 4 flowers start merging
    stems.forEach(segMeshes => segMeshes.forEach((m, i) => { m.visible = stemsShouldShow && (i < segCount); }));

    const fp = smooth(progressOf(t, T_FLOWER_BLOOM));
    flowers.forEach(f => f.setBloom(fp));

    const mp = smooth(progressOf(t, T_MERGE));
    flowers.forEach((f, idx) => {
      if (mp <= 0){
        f.group.position.copy(f.homePos);
        f.group.scale.setScalar(1);
        f.group.visible = fp > 0;
        return;
      }
      const spiralTurns = 1.4;
      const startAngle = Math.atan2(f.homePos.y, f.homePos.x);
      const startRadius = Math.hypot(f.homePos.x, f.homePos.y);
      const radius = lerp(startRadius, 0, mp);
      const angle = startAngle + mp * spiralTurns * Math.PI * 2;
      f.group.position.set(radius*Math.cos(angle), radius*Math.sin(angle), lerp(f.homePos.z, HEART_POS.z, mp));
      f.group.scale.setScalar(lerp(1, 0.15, mp));
      f.group.visible = mp < 0.98;
    });

    const mbp = smooth(progressOf(t, T_MERGED_BLOOM));
    mergedFlower.group.scale.setScalar(lerp(0.001, 1, mbp));
    mergedFlower.setBloom(mbp);

    const vaOpacity = smooth(progressOf(t, T_VA_IN));
    vaSprite.material.opacity = vaOpacity;
    vaMarker.mat.opacity = vaOpacity * 0.9; vaMarker.light.intensity = vaOpacity * 1.1;
  }
  update(0);

  return {
    extent: 1.5,
    update,
    dispose(){
      root.remove(group);
      group.traverse(obj => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) { if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose()); else obj.material.dispose(); }
      });
    }
  };
}

function buildHienLuanAnimation(root, colorHex){
  const BUBBLE_R = 2.1;
  const TIP_Z = 1.0; // Crown height -- tip of the inverted-conch spiral

  const group = new THREE.Group();
  root.add(group);

  // Siddham SCA glyph at the Buddha's heart-origin, sized to match the
  // +LOTUS_SEQUENCE glyphs -- now placed inside the same standardized
  // marker sphere used everywhere else, for better visibility.
  const scaSprite = makeSiddhamSprite('SCA', 0.204);
  scaSprite.position.set(0, 0, 0);
  scaSprite.material.opacity = 0;
  group.add(scaSprite);
  const scaMarker = makeStandardGlyphMarkerSphere();
  scaMarker.mesh.position.set(0, 0, 0);
  scaMarker.light.position.set(0, 0, 0);
  group.add(scaMarker.mesh);
  group.add(scaMarker.light);

  // ---- Step 8: starting ~10s in, over 5 seconds the UPPER half of the
  // (ever-present, holdOpen) Bubble of Ego slowly turns whiter -- like a
  // light being switched on in a dark room -- while the LOWER half's
  // darkness fades away, leaving it clearer and more transparent. Both
  // effects are driven by ONE continuous, seamless full-sphere shell each
  // (a smooth vertex-color gradient straddling the equator, not two
  // separate hemisphere meshes), so there is never a hard seam/dark line
  // at Z=0. After the 5-second transition completes, the whole +HIEN_LUAN
  // sequence resets (see CYCLE below).
  const STEP8_ENABLED = true;
  const stepShellRadius = BUBBLE_R * 0.985;
  const stepShellGeo = new THREE.SphereGeometry(stepShellRadius, 48, 32);
  stepShellGeo.rotateX(Math.PI/2); stepShellGeo.rotateZ(-Math.PI/2); // match createOuterBubbleGeometry's orientation
  const stepVertexCount = stepShellGeo.attributes.position.count;
  const stepZNorm = new Float32Array(stepVertexCount);
  for (let i=0;i<stepVertexCount;i++){ stepZNorm[i] = stepShellGeo.attributes.position.getZ(i) / stepShellRadius; }
  // Smooth, continuous gradient across the equator (soft band so the
  // transition itself has no visible edge): upperWeight ~1 well above
  // Z=0, ~0 well below it; lowerWeight is simply its complement.
  const STEP8_BAND = 0.16;
  const stepUpperWeight = new Float32Array(stepVertexCount);
  for (let i=0;i<stepVertexCount;i++){
    let g = (stepZNorm[i] + STEP8_BAND) / (2*STEP8_BAND);
    g = Math.max(0, Math.min(1, g));
    stepUpperWeight[i] = g*g*(3-2*g); // smoothstep
  }
  // Shell 1: upper Bubble brightening (additive white glow), intensity
  // scaled by upperWeight so only the top half ever lights up.
  const upperGlowGeo = stepShellGeo.clone();
  const upperGlowColorAttr = new THREE.BufferAttribute(new Float32Array(stepVertexCount*3), 3);
  upperGlowGeo.setAttribute('color', upperGlowColorAttr);
  for (let i=0;i<stepVertexCount;i++){ const g = stepUpperWeight[i]; upperGlowColorAttr.setXYZ(i, g, g, g); }
  const upperGlowMat = new THREE.MeshBasicMaterial({ vertexColors:true, transparent:true, opacity:0, side:THREE.FrontSide, blending:THREE.AdditiveBlending, depthWrite:false });
  const upperGlowMesh = new THREE.Mesh(upperGlowGeo, upperGlowMat);
  upperGlowMesh.renderOrder = 4;
  group.add(upperGlowMesh);
  // Shell 2: lower Bubble darkness (dark tint), intensity scaled by
  // lowerWeight (1-upperWeight) so only the bottom half ever carries any
  // tint -- this is what fades away into transparency over the 5 seconds.
  const lowerDimGeo = stepShellGeo.clone();
  const lowerDimColorAttr = new THREE.BufferAttribute(new Float32Array(stepVertexCount*3), 3);
  lowerDimGeo.setAttribute('color', lowerDimColorAttr);
  const DIM_TINT = new THREE.Color(0x160a24);
  for (let i=0;i<stepVertexCount;i++){ const g = 1 - stepUpperWeight[i]; lowerDimColorAttr.setXYZ(i, DIM_TINT.r*g, DIM_TINT.g*g, DIM_TINT.b*g); }
  const lowerDimMat = new THREE.MeshBasicMaterial({ vertexColors:true, transparent:true, opacity:0, side:THREE.FrontSide, depthWrite:false });
  const lowerDimMesh = new THREE.Mesh(lowerDimGeo, lowerDimMat);
  lowerDimMesh.renderOrder = 4;
  group.add(lowerDimMesh);

  // ---- 3-section trajectory:
  //   Section 1 (brown)  -- a WIDE, LOW sweep: broad arcs, starting deep
  //                         below the Buddha and out near the Bubble's
  //                         inner wall, sweeping in less than one full turn
  //                         (like broad converging rays, not a tight
  //                         vortex) as they funnel down toward a single
  //                         point at Z=0 (the mouth of the core spiral).
  //   Section 2 (blue)   -- exactly ONE visible strand: it starts at that
  //                         same converge point (r=0, Z=0), widens out to
  //                         the Buddha's body diameter over its FIRST loop,
  //                         then slowly narrows again, loop by loop, over
  //                         the next 4 loops, arriving at a point exactly
  //                         at the crown (Z=1). All particles/streamlines
  //                         share this identical single-line path here, so
  //                         only one coil is ever visible.
  //   Section 3 (light)  -- bursts outward starting exactly AT the crown
  //                         (Z=1, r=0) -- not at Z=0 -- then fans out into
  //                         12 distinct rays sweeping down across the
  //                         upper Bubble in one smooth dome.
  const BROWN_COLOR   = new THREE.Color(0x3d2410);              // darkest -- raw, unconverted energy (Section 1, slowest)
  const SECTION2_COLOR = new THREE.Color(0x35ff8a);              // vivid GREEN -- energy mid-transformation (Section 2, a bit faster)
  const LIGHT_COLOR = new THREE.Color(colorHex || '#ffe9a8').lerp(new THREE.Color(0xffffff), 0.88); // brightest near-white -- fully transformed light (Section 3, fastest)
  // Time allocation across one particle loop also controls perceived SPEED:
  // Section 1 gets the largest share (slowest), Section 2 a bit less (a
  // bit faster), Section 3 the smallest share (fastest).
  // Phase boundaries recalibrated so all 3 sections' particles travel at
  // the SAME real-world speed (matched to Section 1's speed, which was
  // the slowest of the 3) instead of each section getting an even 1/3-ish
  // share of a fixed total loop time regardless of how much physical
  // distance it actually covers. Measured average path lengths: Section 1
  // (brown converge) ~4.76 units, Section 2 (green conch spiral) ~9.79
  // units, Section 3 (light dome burst) ~3.33 units. At the OLD boundaries
  // (S1=0.50, S2=0.8333 -- i.e. even/fixed time shares of 1.8s/1.2s/0.6s)
  // that worked out to speeds of ~2.64 / ~8.16 / ~5.54 units/sec --
  // Section 2 and 3 both moved much faster than Section 1. Rescaling the
  // boundaries below (and PARTICLE_LOOP_SECONDS) makes every section's
  // particles move at Section 1's original ~2.64 units/sec.
  const S1 = 0.2663, S2 = 0.8140; // recalibrated for equal particle speed across all 3 sections (see note above)
  const BLEND_BAND = 0.05;    // soft crossfade width at each phase boundary
  const CONVERGE_TURNS = 0.6; // wide, low sweep -- well under one full turn
  const CONCH_TOTAL_TURNS = 5;      // 1 widening loop + 4 narrowing loops
  const CONCH_WIDEN_FRACTION = 0.2; // 1 of the 5 total loops is the widening phase
  const CONCH_MAX_R = 0.6;          // widens out to roughly the Buddha's body diameter
  const DOME_MAX_THETA = 2.0;       // polar angle (radians) the dome burst sweeps down to -- widened so it fills much more of the Bubble's interior

  const smooth = (x) => x*x*(3-2*x);
  const clamp01 = (x) => Math.max(0, Math.min(1, x));

  // ROOT CAUSE of Section 2 reading as white/cyan instead of green: the old
  // brightenColor() multiplied r/g/b directly and clamped each channel to 1
  // independently. SECTION2_COLOR (0x35ff8a = r0.21,g1.0,b0.54) times its
  // old 2.6x multiplier produced (0.54, 1, 1) -- g and b both slammed to
  // their 1.0 ceiling, which desaturates the color into pale cyan-white,
  // destroying the green hue entirely. Fixed by brightening in HSL space
  // instead: hue and saturation are preserved exactly, and only lightness
  // is lifted (eased toward, never past, a capped ceiling) -- so a color
  // gets brighter/more vivid without ever being washed out toward white.
  const LIFT_SECTION1 = 0.55; // brown starts very dark, so lift it the most
  const LIFT_SECTION2 = 0.12; // green is already fairly bright by default -- only a gentle lift, enough to stay vivid and clearly green
  const LIFT_SECTION3 = 0.55; // light phase is intentionally designed to trend toward white -- lift is fine here
  const tmpHSL = { h:0, s:0, l:0 };
  function brightenColor(c, lift){
    c.getHSL(tmpHSL);
    tmpHSL.l = Math.min(0.88, tmpHSL.l + (1 - tmpHSL.l) * lift);
    tmpHSL.s = Math.min(1, tmpHSL.s * 1.08);
    c.setHSL(tmpHSL.h, tmpHSL.s, tmpHSL.l);
  }
  function phaseColorAt(s, outColor){
    if (s < S1 - BLEND_BAND) { outColor.copy(BROWN_COLOR); brightenColor(outColor, LIFT_SECTION1); return; }
    if (s < S1 + BLEND_BAND) { const k=(s-(S1-BLEND_BAND))/(2*BLEND_BAND); outColor.copy(BROWN_COLOR).lerp(SECTION2_COLOR, k); brightenColor(outColor, LIFT_SECTION1 + (LIFT_SECTION2-LIFT_SECTION1)*k); return; }
    if (s < S2 - BLEND_BAND) { outColor.copy(SECTION2_COLOR); brightenColor(outColor, LIFT_SECTION2); return; }
    if (s < S2 + BLEND_BAND) { const k=(s-(S2-BLEND_BAND))/(2*BLEND_BAND); outColor.copy(SECTION2_COLOR).lerp(LIGHT_COLOR, k); brightenColor(outColor, LIFT_SECTION2 + (LIFT_SECTION3-LIFT_SECTION2)*k); return; }
    outColor.copy(LIGHT_COLOR); brightenColor(outColor, LIFT_SECTION3);
  }
  // Which of the 3 sections (0, 1, 2) a given phase position s belongs to --
  // used to gate each section's staged reveal below.
  function sectionIndexOf(s){ return s < S1 ? 0 : (s < S2 ? 1 : 2); }

  // ---- Section 3 shape: two-phase parabola-then-circle design. Per
  // feedback, even after matching position AND slope (tangent direction)
  // exactly at the peak, a small kink was still visible -- this is
  // because the two curves' CURVATURE (how sharply they bend) differed a
  // lot at that point: the parabola bends much more sharply there than
  // the circle does, so even though they touch and point the same way,
  // one visibly bends harder right at the seam, reading as a kink.
  // Fix: instead of an instant hand-off at one exact point, blend the two
  // formulas together over a short window straddling the peak, using a
  // smoothstep S-curve weight. This spreads the curvature change out
  // over a short stretch of the path instead of concentrating it at a
  // single point, which removes the visual "snap".
  const HIENLUAN_PEAK_R = 0.55;      // radius (from the central axis) at the notional hand-off point between rise and fall
  const HIENLUAN_PEAK_Z = TIP_Z + 0.85; // height at the notional hand-off point
  // Circle/sphere radius the FALL phase slides along -- passes exactly
  // through the peak point, and is comfortably smaller than the Bubble's
  // own inner wall (BUBBLE_R=2.1, safe limit ~2.07).
  const HIENLUAN_FALL_SPHERE_R = Math.sqrt(HIENLUAN_PEAK_R*HIENLUAN_PEAK_R + HIENLUAN_PEAK_Z*HIENLUAN_PEAK_Z);
  // Circle's own slope (dz/dr) at the peak point -- the target slope the
  // parabola is built to also have there, so the two curves point the
  // same direction going into the blend.
  const HIENLUAN_PEAK_SLOPE = -HIENLUAN_PEAK_R / HIENLUAN_PEAK_Z;
  // Solve A, B for the RISE parabola z(r) = TIP_Z + B*r + A*r^2 such that
  // z(Rp)=Zp and dz/dr(Rp) = HIENLUAN_PEAK_SLOPE.
  const HIENLUAN_RISE_H = HIENLUAN_PEAK_Z - TIP_Z;
  const HIENLUAN_RISE_A = (HIENLUAN_PEAK_SLOPE*HIENLUAN_PEAK_R - HIENLUAN_RISE_H) / (HIENLUAN_PEAK_R*HIENLUAN_PEAK_R);
  const HIENLUAN_RISE_B = HIENLUAN_PEAK_SLOPE - 2*HIENLUAN_RISE_A*HIENLUAN_PEAK_R;
  const HIENLUAN_RISE_FRACTION = 0.40; // notional progress-fraction of the peak/hand-off point
  const HIENLUAN_END_R = 1.80; // how far out (from the axis) the fall phase travels before stopping
  // Half-width (in progress units p) of the blend window straddling the
  // peak -- the two curves are cross-faded across
  // [RISE_FRACTION-BLEND_HW, RISE_FRACTION+BLEND_HW] instead of switching
  // instantly, to smooth out the curvature change.
  const HIENLUAN_BLEND_HW = 0.09;
  function hienluanRiseRZ(p){
    // Rise curve's own r(p): linear from 0 at p=0 to Rp at p=RISE_FRACTION
    // (formula is simply extended past RISE_FRACTION when used inside the
    // blend window).
    const r = HIENLUAN_PEAK_R * (p / HIENLUAN_RISE_FRACTION);
    const z = TIP_Z + HIENLUAN_RISE_B*r + HIENLUAN_RISE_A*r*r;
    return { r, z };
  }
  function hienluanFallRZ(p){
    // Fall curve's own r(p): linear from Rp at p=RISE_FRACTION to END_R at
    // p=1 (formula is simply extended before RISE_FRACTION when used
    // inside the blend window).
    const w = (p - HIENLUAN_RISE_FRACTION) / (1 - HIENLUAN_RISE_FRACTION);
    const r = HIENLUAN_PEAK_R + (HIENLUAN_END_R - HIENLUAN_PEAK_R) * w;
    const z = Math.sqrt(Math.max(0, HIENLUAN_FALL_SPHERE_R*HIENLUAN_FALL_SPHERE_R - r*r));
    return { r, z };
  }
  // Given overall progress p (0..1) along the ray, returns {r, z} for
  // Section 3's two-phase shape, cross-fading smoothly through the blend
  // window around the peak.
  function hienluanBurstShape(p){
    const loEdge = HIENLUAN_RISE_FRACTION - HIENLUAN_BLEND_HW;
    const hiEdge = HIENLUAN_RISE_FRACTION + HIENLUAN_BLEND_HW;
    if (p <= loEdge){
      return hienluanRiseRZ(p);
    } else if (p >= hiEdge){
      return hienluanFallRZ(p);
    } else {
      // Inside the blend window: evaluate BOTH curves' formulas at this p
      // (each simply extended slightly past its normal domain) and
      // cross-fade with a smoothstep weight, so r, z, and the path's
      // curvature all change gradually across the window rather than
      // switching abruptly at one point.
      const t = (p - loEdge) / (hiEdge - loEdge); // 0 -> 1 across the window
      const w = t*t*(3 - 2*t); // smoothstep
      const rise = hienluanRiseRZ(p);
      const fall = hienluanFallRZ(p);
      const r = rise.r + (fall.r - rise.r) * w;
      const z = rise.z + (fall.z - rise.z) * w;
      return { r, z };
    }
  }

  function energyPointAt(s, seed, outVec){
    let x, y, z;
    if (s < S1){
      // Section 1: a wide, low sweep -- starting deep below the Buddha and
      // out near the Bubble's inner wall, sweeping through less than one
      // full turn as it funnels down to a single point at Z=0.
      const p = s/S1;
      const ease = smooth(p);
      z = seed.startZ * (1-ease);
      const r = seed.startR * (1-ease*ease); // wide sweep, only pinches in sharply near the very end
      const angle = seed.startAngle + ease*CONVERGE_TURNS*Math.PI*2;
      x = r*Math.cos(angle); y = r*Math.sin(angle);
    } else if (s < S2){
      // Section 2: ONE shared spiral strand (angle/radius here intentionally
      // ignore the per-seed azimuth, so every streamline/particle overlaps
      // into a single visible coil) -- widens to the Buddha's body diameter
      // across the first loop, then narrows loop by loop across the next 4
      // loops, ending exactly at the crown point (Z=1, r=0).
      const p = (s-S1)/(S2-S1);
      z = p*TIP_Z;
      const angle = p*CONCH_TOTAL_TURNS*Math.PI*2; // shared reference angle -- no seed-specific offset
      let r;
      if (p < CONCH_WIDEN_FRACTION){
        const w = p/CONCH_WIDEN_FRACTION;
        r = CONCH_MAX_R*smooth(w);
      } else {
        const w = (p-CONCH_WIDEN_FRACTION)/(1-CONCH_WIDEN_FRACTION);
        r = CONCH_MAX_R*(1-smooth(w));
      }
      x = r*Math.cos(angle); y = r*Math.sin(angle);
    } else {
      // Section 3 -- fresh design built directly from the side-view / top-
      // view reference markups: ONE smooth, continuous cubic-Hermite
      // spline (r, z, and an extra azimuthal curl) through the crown-rise
      // / arc-up-and-out / descend-to-the-edge keyframes. The spline's
      // tangent vector is shared at every interior keyframe (via the
      // finite-difference tangents computed above), guaranteeing the
      // curve's direction matches exactly across each join -- a single
      // unbroken, smooth line with no kinks or corners.
      // Each of the 9 rays starts at its own fixed, evenly-spaced heading
      // (seed.umbrellaAzimuth), then curls by the SAME extra swirl amount
      // (thetaOffset) as it travels outward -- so from directly above,
      // every ray sweeps smoothly from the center out toward the rim,
      // curving to one side along the way, exactly like the top-view
      // markup -- and never loops back toward the center.
      const p = (s-S2)/(1-S2);
      const shape = hienluanBurstShape(p);
      const finalAngle = seed.umbrellaAzimuth; // no spiral -- fixed heading per ray
      x = Math.max(0, shape.r)*Math.cos(finalAngle);
      y = Math.max(0, shape.r)*Math.sin(finalAngle);
      z = shape.z;
    }
    outVec.set(x, y, z);
  }

  // ---- Streamlines (static full paths, colored per-section), now split
  // into 3 SEPARATE per-section line objects (rather than one continuous
  // line per streamline) so each section can be staged in on its own
  // timeline -- Section 1 pulls energy toward the center first, THEN (after
  // a pause) Section 2 animates, THEN (after another pause) Section 3
  // bursts -- instead of all 3 sections appearing simultaneously.
  const NUM_STREAMLINES = 9; // reduced from 12 -- fewer rays across all 3 sections for a cleaner look
  const STREAM_SEGMENTS = 480; // high resolution so the Section 2 coil (5 tight loops) renders as a smooth curve instead of visibly faceted/broken straight segments
  const streamSeeds = [];
  for (let i=0;i<NUM_STREAMLINES;i++){
    const angle = (i/NUM_STREAMLINES) * Math.PI*2;
    const startZ = -0.3 - (i % 4) * 0.42; // deep, low starting heights (down to about Z=-1.56)
    const startR = Math.sqrt(Math.max(0, BUBBLE_R*BUBBLE_R - startZ*startZ)) * 0.88; // wide -- close to the Bubble's inner wall
    streamSeeds.push({ startZ, startAngle: angle, startR, umbrellaAzimuth: angle, umbrellaSwirl: 0.45 });
  }
  const streamPositions = new Float32Array(NUM_STREAMLINES*STREAM_SEGMENTS*3);
  const streamColors = new Float32Array(NUM_STREAMLINES*STREAM_SEGMENTS*3);
  const streamVec = new THREE.Vector3();
  const tmpColorA = new THREE.Color();
  streamSeeds.forEach((seed, si) => {
    for (let j=0;j<STREAM_SEGMENTS;j++){
      const s = j/(STREAM_SEGMENTS-1);
      energyPointAt(s, seed, streamVec);
      phaseColorAt(s, tmpColorA);
      const base = (si*STREAM_SEGMENTS + j) * 3;
      streamPositions[base] = streamVec.x; streamPositions[base+1] = streamVec.y; streamPositions[base+2] = streamVec.z;
      streamColors[base] = tmpColorA.r; streamColors[base+1] = tmpColorA.g; streamColors[base+2] = tmpColorA.b;
    }
  });
  // ---- ROOT CAUSE of both the "spaghetti tangle" AND Section 2 reading as
  // white instead of green: Section 2's path formula intentionally IGNORES
  // each streamline's individual seed (angle/azimuth) so all 12 rays
  // collapse onto ONE shared coil -- but the old code still built and drew
  // all 12 of those perfectly-identical, perfectly-overlapping copies. With
  // ADDITIVE blending, stacking 12 identical bright-green lines exactly on
  // top of each other sums their color 12x over -- green (0.21,1,0.54)
  // adds up almost immediately to pure white well before all 12 layers are
  // even drawn, and the many exactly-overlapping/near-numerically-identical
  // vertices produced the tangled, twisted "spaghetti" look in the tube
  // experiment. Fix: Section 2 is now built and drawn exactly ONCE (not 12
  // times) -- it was always meant to look like a single strand.
  // Also reverting away from the earlier solid-tube-mesh experiment (which
  // introduced its own extrusion/frame artifacts, especially near the
  // sharp convergence point where Section 1's 12 rays pinch down toward
  // r=0) back to simple, robust THREE.Line rendering: ONE clean line per
  // section per ray (no parallel offset "halo" duplicates either, which
  // is what caused the earlier "multi-strand" look) -- thickness is instead
  // conveyed by the large, bright, glowing flow particles traveling along
  // each line (see PARTICLES_PER_STREAMLINE / particle size below).
  const sectionLineMats = [0,1,2].map(() => new THREE.LineBasicMaterial({ vertexColors:true, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, linewidth:2 }));
  const idxS1 = Math.round(S1 * (STREAM_SEGMENTS-1));
  const idxS2 = Math.round(S2 * (STREAM_SEGMENTS-1));
  const SECTION_RANGES = [ [0, idxS1], [idxS1, idxS2], [idxS2, STREAM_SEGMENTS-1] ];
  for (let si=0; si<NUM_STREAMLINES; si++){
    const fullPos = streamPositions.slice(si*STREAM_SEGMENTS*3, (si+1)*STREAM_SEGMENTS*3);
    const fullCol = streamColors.slice(si*STREAM_SEGMENTS*3, (si+1)*STREAM_SEGMENTS*3);
    SECTION_RANGES.forEach(([lo, hi], sectionIdx) => {
      // Section 2 (index 1) is IDENTICAL for every streamline (its formula
      // ignores the per-seed azimuth by design) -- so only build it once,
      // from si===0, instead of drawing 12 perfectly-overlapping copies.
      if (sectionIdx === 1 && si !== 0) return;
      const posSlice = fullPos.slice(lo*3, (hi+1)*3);
      const colSlice = fullCol.slice(lo*3, (hi+1)*3);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(posSlice, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colSlice, 3));
      const line = new THREE.Line(geo, sectionLineMats[sectionIdx]);
      group.add(line);
    });
  }

  // ---- Flowing point particles: small glowing dots continuously traveling
  // the full brown -> green -> light path along each streamline, exactly
  // like +TORUS_IN/+TORUS_OUT's flowing-particle technique. Particles
  // currently positioned within a not-yet-revealed section are hidden by
  // zeroing their color (additive blending means black == invisible),
  // rather than by any geometry/visibility toggle -- so the SAME staged
  // reveal timeline governs both the static streamlines and these moving
  // particles automatically.
  function glowTexture(hex){
    const c = document.createElement('canvas'); c.width=64; c.height=64;
    const ctx = c.getContext('2d'); const g = ctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,'#ffffff'); g.addColorStop(0.3,hex); g.addColorStop(0.7,hex+'66'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  }
  const PARTICLES_PER_STREAMLINE = 6; // doubled -- denser flow of light along every ray for clearer visibility
  const totalParticles = NUM_STREAMLINES * PARTICLES_PER_STREAMLINE;
  const particlePositions = new Float32Array(totalParticles*3);
  const particleColors = new Float32Array(totalParticles*3);
  const particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
  particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
  const particleMat = new THREE.PointsMaterial({ size:0.4, map:glowTexture('#ffe9a8'), vertexColors:true, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true }); // bigger glowing flow-balls -- the primary way the energy flow reads clearly now
  const particlePoints = new THREE.Points(particleGeo, particleMat);
  group.add(particlePoints);

  const PARTICLE_LOOP_SECONDS = 6.76; // one full brown->green->white pass per particle.
                                       // With the recalibrated S1/S2 above, every section
                                       // now gets exactly the wall-clock time its own path
                                       // length requires to move at the SAME speed as
                                       // Section 1 (the slowest section): Section 1 ~1.80s,
                                       // Section 2 ~3.70s, Section 3 ~1.26s -- no more
                                       // visibly faster/slower sections.

  // ---- Staged reveal timeline: SCA appears at the heart-origin first;
  // shortly after, Section 1 begins pulling energy in toward (0,0,0);
  // after a brief pause, Section 2 (now green) animates; after another
  // brief pause, Section 3 bursts from the crown -- matching the pacing
  // style already used by +LOTUS_SEQUENCE / +HIEN_LUAN's own staged steps.
  const SCA_FADE_DURATION  = 1.0;  // SCA glyph fade-in time
  const SECTION_FADE       = 0.9;  // each section's own fade-in time once its turn arrives
  const SECTION_GAP        = 1.0;  // pause between one section finishing its fade-in and the next one starting
  const SECTION1_START = SCA_FADE_DURATION + 0.3;                          // Section 1 starts shortly after SCA is visible
  const SECTION2_START = SECTION1_START + SECTION_FADE + SECTION_GAP;      // Section 2 starts after a pause
  const SECTION3_START = SECTION2_START + SECTION_FADE + SECTION_GAP;      // Section 3 starts after another pause
  const SECTION_STARTS = [SECTION1_START, SECTION2_START, SECTION3_START];

  const STEP8_START = 10.0;          // Step 8 (Bubble brighten/fade) begins ~10s in -- well after all 3 sections have fully revealed
  const STEP8_DURATION = 5.0;        // the brighten/fade transition lasts 5 seconds
  const CYCLE = STEP8_START + STEP8_DURATION; // 15s total -- the whole sequence resets right after Step 8 finishes

  const tmpColorB = new THREE.Color();

  // Per-section fade-in progress (0..1) at a given absolute time t.
  function sectionRevealAt(sectionIdx, t){
    return smooth(clamp01((t - SECTION_STARTS[sectionIdx]) / SECTION_FADE));
  }

  function update(elapsedRaw){
    const t = elapsedRaw % CYCLE;

    // SCA glyph fades in at the very start of every loop, at the exact
    // heart-origin (0,0,0).
    const scaOpacity = smooth(clamp01(t/SCA_FADE_DURATION));
    scaSprite.material.opacity = scaOpacity;
    scaMarker.mat.opacity = scaOpacity * 0.9; scaMarker.light.intensity = scaOpacity * 1.1;

    // Step 8: upper Bubble slowly turns whiter (light switching on) while
    // the lower Bubble's darkness fades into transparency -- both eased
    // smoothly over the 5-second window starting at STEP8_START, then the
    // whole sequence resets (t wraps back to 0 via the % CYCLE above).
    if (STEP8_ENABLED) {
      // step8P stays exactly 0 for the whole first STEP8_START seconds, so
      // gating lowerDimMat.opacity on (t >= STEP8_START) ensures the dark
      // shell is fully ABSENT the entire time beforehand -- it only ever
      // appears right as the 5-second clearing transition begins, then
      // fades to fully transparent by the time the transition completes.
      const step8P = smooth(clamp01((t - STEP8_START) / STEP8_DURATION));
      upperGlowMat.opacity = step8P * 0.75;
      lowerDimMat.opacity = (t >= STEP8_START) ? (1 - step8P) * 0.22 : 0;
    }

    // Each section's streamline fades in independently, staged one after
    // another: Section 1 (brown, pulling toward center) first, then (after
    // a pause) Section 2 (green, now drawn as a single clean strand rather
    // than 12 overlapping copies), then (after another pause) Section 3
    // (bright burst).
    for (let i=0;i<3;i++){
      sectionLineMats[i].opacity = 1.0 * sectionRevealAt(i, t);
    }
    particleMat.opacity = sectionRevealAt(0, t); // particles turn on as soon as Section 1 begins; individual particles beyond an unrevealed section are hidden via zeroed color below

    if (t <= SECTION1_START) { return; }

    let ptr = 0;
    for (let si=0; si<NUM_STREAMLINES; si++){
      const seed = streamSeeds[si];
      for (let p=0; p<PARTICLES_PER_STREAMLINE; p++){
        const basePhase = p / PARTICLES_PER_STREAMLINE;
        const localT = (t + basePhase*PARTICLE_LOOP_SECONDS) % PARTICLE_LOOP_SECONDS;
        const s = localT / PARTICLE_LOOP_SECONDS;
        energyPointAt(s, seed, streamVec);
        phaseColorAt(s, tmpColorB);
        // Hide this particle (zero it out -- invisible under additive
        // blending) if the section it currently occupies hasn't been
        // revealed yet at this point in the staged timeline.
        const reveal = sectionRevealAt(sectionIndexOf(s), t);
        tmpColorB.multiplyScalar(reveal);
        const base = ptr*3;
        particlePositions[base] = streamVec.x; particlePositions[base+1] = streamVec.y; particlePositions[base+2] = streamVec.z;
        particleColors[base] = tmpColorB.r; particleColors[base+1] = tmpColorB.g; particleColors[base+2] = tmpColorB.b;
        ptr++;
      }
    }
    particleGeo.attributes.position.needsUpdate = true;
    particleGeo.attributes.color.needsUpdate = true;
  }
  update(0);

  return {
    extent: BUBBLE_R + 0.2,
    update,
    dispose(){
      root.remove(group);
      group.traverse(obj => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) { if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose()); else obj.material.dispose(); }
      });
    }
  };
}

function buildEgoSequenceMarker(pos, sphereColorHex, glyphKey, glyphWorldHeight){
  const group = new THREE.Group();
  group.position.copy(pos);
  const color = new THREE.Color(sphereColorHex);
  // depthWrite:false -- so this translucent marker sphere never blocks the
  // glyph sprite sitting at its exact center (see sprite fix below) or
  // anything else behind it.
  const mat = new THREE.MeshPhysicalMaterial({ color, emissive:color, emissiveIntensity:0.55, roughness:0.25, metalness:0.2, transparent:true, opacity:0, depthWrite:false });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.17, 28, 28), mat);
  group.add(mesh);
  const light = new THREE.PointLight(color.getHex(), 0, 1.8);
  group.add(light);
  const sprite = makeSiddhamSprite(glyphKey, glyphWorldHeight);
  // Force the glyph to always render on top of its marker sphere: without
  // this, the sprite (positioned exactly at the sphere's center, i.e.
  // farther from the camera than the sphere's own near-facing surface) was
  // being depth-test-rejected and never drawn at all.
  sprite.material.depthTest = false;
  sprite.renderOrder = 10;
  group.add(sprite);
  return { group, mesh, mat, light, sprite };
}

function buildEgoSequenceAnimation(root, colorHex){
  const group = new THREE.Group();
  root.add(group);

  const ORANGE = '#ff8c1a'; // Sunlight / Nhat Quang -- BA
  const GREEN  = '#28c76f'; // Moonlight / Nguyet Quang -- DA

  const STEPS = [
    { key:'BA', sphereColor:ORANGE, pos:new THREE.Vector3(0.0, 2.0, 0.0) },
    { key:'DA', sphereColor:GREEN,  pos:new THREE.Vector3(0.0,-2.0, 0.0) },
    { key:'BA', sphereColor:ORANGE, pos:new THREE.Vector3(0.0, 0.0, 2.0) },
    { key:'DA', sphereColor:GREEN,  pos:new THREE.Vector3(0.0, 0.0,-2.0), formEgo:true }, // Bubble of Ego forms here
    { key:'BA', sphereColor:ORANGE, pos:new THREE.Vector3(-2.0, 1.5, 2.0) },
    { key:'DA', sphereColor:GREEN,  pos:new THREE.Vector3(-0.8, 1.0, 1.0) }
  ];

  const markers = STEPS.map(step => {
    const m = buildEgoSequenceMarker(step.pos, step.sphereColor, step.key, 0.22);
    group.add(m.group);
    return m;
  });

  // The Bubble of Ego mesh/material is built once, up front (so it never
  // needs to be rebuilt mid-sequence), but its geometry is only actually
  // swept open once EGO_START is reached (see update() below) -- exactly
  // the holdOpen contract already used by +LOTUS_SEQUENCE / +HIEN_LUAN.
  const egoAnim = buildEgoBubbleObjectAnimation(group, { holdOpen: true });

  const STEP_START = [0.0, 1.3, 2.6, 3.9, 5.4, 6.7]; // seconds -- extra gap after step 4 lets the Bubble of Ego finish forming first
  const FADE_DURATION = 0.9;
  const EGO_START = STEP_START[3]; // Bubble of Ego begins forming exactly when the 4th marker (DA @ 0,0,-2) is revealed
  const HOLD_AFTER_LAST = 3.0;
  const CYCLE = STEP_START[STEP_START.length-1] + FADE_DURATION + HOLD_AFTER_LAST; // then the whole sequence resets

  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const smooth = (x) => x*x*(3-2*x);

  // Tracks which loop iteration we're currently in so the Bubble of Ego can
  // be explicitly closed back down (egoAnim.reset()) the instant a new loop
  // begins -- without this, once the Bubble fully opens it latches
  // "fullyFormed" permanently and would otherwise stay open forever across
  // every subsequent reset/loop, instead of restarting from the bare Buddha
  // statue (no Bubble) each time, only re-forming once the 4th glyph
  // (DA @ 0,0,-2) is revealed again.
  let lastCycleIndex = -1;
  function update(elapsedRaw){
    const cycleIndex = Math.floor(elapsedRaw / CYCLE);
    if (cycleIndex !== lastCycleIndex) {
      lastCycleIndex = cycleIndex;
      egoAnim.reset();
    }
    const t = elapsedRaw % CYCLE;
    markers.forEach((m, i) => {
      const p = smooth(clamp01((t - STEP_START[i]) / FADE_DURATION));
      m.mat.opacity = p * 0.85;
      m.light.intensity = p * 1.1;
      m.sprite.material.opacity = p;
    });
    egoAnim.update(Math.max(0, t - EGO_START));
  }
  update(0);

  return {
    extent: 3.3,
    update,
    dispose(){
      egoAnim.dispose();
      root.remove(group);
      group.traverse(obj => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) { if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose()); else obj.material.dispose(); }
      });
    }
  };
}


        const textureCache = new Map();

        async function loadSiddhamTexture(nodeData) {
            const cacheKey = nodeData.id;
            if (textureCache.has(cacheKey)) {
                return textureCache.get(cacheKey);
            }

            const candidates = buildCandidateUrls(nodeData.siddhamImage, nodeData.id);

            for (const candUrl of candidates) {
                const isHttp = candUrl.startsWith('http://') || candUrl.startsWith('https://');
                if (isHttp) {
                    try {
                        const res = await fetch(candUrl, { mode: 'cors' });
                        if (res.ok) {
                            const blob = await res.blob();
                            if (blob && blob.size > 100 && !blob.type.includes('html')) {
                                const objUrl = URL.createObjectURL(blob);
                                const img = new Image();
                                await new Promise((resolve, reject) => {
                                    img.onload = resolve;
                                    img.onerror = reject;
                                    img.src = objUrl;
                                });
                                const tex = new THREE.Texture(img);
                                tex.colorSpace = THREE.SRGBColorSpace;
                                tex.needsUpdate = true;
                                textureCache.set(cacheKey, tex);
                                return tex;
                            }
                        }
                    } catch (e) { /* continue */ }
                }

                try {
                    const img = new Image();
                    if (isHttp) img.crossOrigin = 'anonymous';
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                        img.src = candUrl;
                    });
                    const tex = new THREE.Texture(img);
                    tex.colorSpace = THREE.SRGBColorSpace;
                    tex.needsUpdate = true;
                    textureCache.set(cacheKey, tex);
                    return tex;
                } catch (e) { /* continue */ }

        function parseCoordinates(coordStr, nodeId = '') {

                text = text.replace(/https?:\/\/[^\s)\]]+/gi, '');
                text = text.replace(/www\.[^\s)\]]+/gi, '');
                text = text.replace(/drive\.google[^\s)\]]+/gi, '');
                
                // 2. Normalize hyphens and minus signs
                text = text.replace(/[\u2212\u2010\u2011\u2012\u2013\u2014\u2015\uFE63\uFF0D]/g, '-');

                // 3. Semicolon delimited (European / Vietnamese number formatting e.g. "0,0; 0,8; -0,1")
                if (text.includes(';')) {
                    const paren = text.match(/[(\[](.*?)[)\]]/);
                    const target = paren ? paren[1] : text;
                    const parts = target.split(';');
                    const nums = [];
                    for (const p of parts) {
                        const m = p.replace(',', '.').match(/-?\d+(?:\.\d+)?/);
                        if (m) nums.push(parseFloat(m[0]));
                    }
                    if (nums.length >= 3) return nums.slice(0, 3);
                }

                // 4. Extract parenthesized or bracketed coordinates: (0.0, 0.8, -0.1) or [0.0, 0.8, -0.1]
                const paren = text.match(/[(\[](.*?)[)\]]/);
                if (paren) {
                    const inside = paren[1].trim();
                    const m = inside.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);
                    if (m) {
                        return [parseFloat(m[1]), parseFloat(m[2]), parseFloat(m[3])];
                    }
                }

                // 5. Look for X: ... Y: ... Z: ... labeled formats
                const xyz = text.match(/x\s*[:=]\s*(-?\d+(?:\.\d+)?).*?y\s*[:=]\s*(-?\d+(?:\.\d+)?).*?z\s*[:=]\s*(-?\d+(?:\.\d+)?)/i);
                if (xyz) {
                    return [parseFloat(xyz[1]), parseFloat(xyz[2]), parseFloat(xyz[3])];
                }

                // 6. Look for 3 consecutive numbers separated by commas or semicolons
                const m = text.match(/(-?\d+(?:\.\d+)?)\s*[,;]\s*(-?\d+(?:\.\d+)?)\s*[,;]\s*(-?\d+(?:\.\d+)?)/);
                if (m) {
                    return [parseFloat(m[1]), parseFloat(m[2]), parseFloat(m[3])];
                }

                // 7. Look for 3 numbers separated by whitespace
                const mSpace = text.match(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/);
                if (mSpace) {
                    return [parseFloat(mSpace[1]), parseFloat(mSpace[2]), parseFloat(mSpace[3])];
                }
            }

            // Fallback to canonical node coordinates if empty or (0, 0, 0)
            if (nodeId && FALLBACK_NODE_COORDINATES[nodeId]) {
                return [...FALLBACK_NODE_COORDINATES[nodeId]];
            }

            return [0, 0, 0];
        }

        function buildSingleActiveActorNode() {
            const containerGroup = new THREE.Group();
            containerGroup.renderOrder = 10; // High priority so Siddham node renders crisply on top of overlays
            containerGroup.visible = false;
            nodesGroup.add(containerGroup);

            // 1. Transparent Crystal Sphere Mesh
            const sphereMat = sphereTransparentMat.clone();
            const sphereMesh = new THREE.Mesh(sphereGeoB, sphereMat);
            sphereMesh.renderOrder = 9;
            containerGroup.add(sphereMesh);

            // 2. Pure Vertical Spin Pivot (Spins around local vertical Z-axis)
            const spinPivot = new THREE.Group();
            spinPivot.renderOrder = 10;
            containerGroup.add(spinPivot);

            // 3. Upright Vertical Plane inside Pivot (High clarity Additive glyph)
            const fallbackTex = createFallbackGlyphTexture("𑖀", "B01");
            const planeMat = new THREE.MeshBasicMaterial({
                map: fallbackTex,
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            const planeMesh = new THREE.Mesh(planeGeoB, planeMat);
            planeMesh.rotation.x = Math.PI / 2;
            planeMesh.renderOrder = 11;
            spinPivot.add(planeMesh);

            // 4. Reference 3D Model Container inside Pivot (For C2 3D Model)
            const modelContainer = new THREE.Group();
            modelContainer.visible = false;
            modelContainer.renderOrder = 11;
            spinPivot.add(modelContainer);

            // 5. Luminous Highlight Ring (Cyan active locator)
            const outlineGeo = new THREE.RingGeometry(0.18, 0.21, 32);
            const outlineMat = new THREE.MeshBasicMaterial({
                color: 0x00e5ff, side: THREE.DoubleSide, transparent: true, opacity: 0.95, depthWrite: false, blending: THREE.AdditiveBlending
            });
            const outlineMesh = new THREE.Mesh(outlineGeo, outlineMat);
            outlineMesh.rotation.x = Math.PI / 2;
            outlineMesh.visible = false;
            outlineMesh.renderOrder = 12;
            spinPivot.add(outlineMesh);

            return {
                group: containerGroup,
                sphere: sphereMesh,
                spinPivot: spinPivot,
                plane: planeMesh,
                planeMat: planeMat,
                modelContainer: modelContainer,
                has3DModel: false,
                outline: outlineMesh,

        function parseGVizTable(table) {
            let cols = table.cols.map((c, i) => ({ index: i, label: (c.label || c.id || '').trim() }));

            const firstRowHasHeaders = dataRows.length > 0 && dataRows[0].c && dataRows[0].c.some(cell => {
                if (!cell || cell.v === null) return false;
                const v = String(cell.f !== undefined ? cell.f : cell.v).trim();
                return v.startsWith('A.') || v.toLowerCase().includes('wbs') || v.toLowerCase().includes('visualization') || v.toLowerCase().includes('lý');
            });

            if (firstRowHasHeaders) {
                const headerRow = dataRows[0];
                cols = cols.map((col, idx) => {
                    const cell = headerRow.c ? headerRow.c[idx] : null;
                    const val = cell && cell.v !== null ? String(cell.f !== undefined ? cell.f : cell.v).trim() : col.label;
                    return { index: idx, label: val || col.label };
                });
                dataRows = dataRows.slice(1);
            }

            const colFind = (keyword) => cols.find(c => c.label.toLowerCase().includes(keyword.toLowerCase()));

            const idCol = cols.find(c => c.label.toLowerCase().startsWith('wbs') || c.label.toLowerCase() === 'id' || c.label.toLowerCase().startsWith('mã')) || cols[0];
            const posCol = colFind('a3') || colFind('khai dẫn') || colFind('khai dan') || colFind('quán tưởng') || colFind('quan tuong') || colFind('a4 hành') || colFind('spatial position') || colFind('hành');
            
            // Coordinate Column source is "Visualization" (extracting purely X, Y, Z coordinates)
            const coordCol = cols.find(c => {
                const l = c.label.toLowerCase().trim();
                return l === 'visualization' || (l.includes('visualization') && !l.includes('guidance')) || l === 'visualize';
            }) || cols.find(c => {
                const l = c.label.toLowerCase().trim();
                return l.includes('visualization') || l.includes('visualize');
            }) || cols.find(c => {
                const l = c.label.toLowerCase().trim();

            }) || cols.find(c => c.index === 3 || c.index === 4); // Column D or E in standard WBSID

            const parsedRows = [];

                const isHienLuanRow = uId.includes('HIEN_LUAN') || uId.includes('HIENLUAN');

                                const checkTag = (tagList, rowKeyword) => {

                // Robust coordinate extraction with automatic fallback to canonical coordinates
                let nodeCoords = [0, 0, 0];

            if (parsedRows.length > 0) {

        window.handleGvizSheetData = function(gvizData) {

        function startDataIngestion() {
            // STEP 1: Immediately initialize complete embedded baseline (0ms)
            useEmbeddedFallbackData();

            // STEP 2: Restore from LocalStorage cache if available
            try {
                const cached = localStorage.getItem('cached_bodhicitta_data');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (parsed.rows && parsed.rows.length > 0) {
                        rawSheetRows = parsed.rows;
                        filterColumns = parsed.cols;
                        initMatrixWithParsedData();
                        syncLabel.innerText = "Matrix Ready (Cached)";
                        syncDot.style.background = "#00ff88";
                    }
                }
            } catch (e) { /* continue */ }

            // STEP 3: Asynchronously load live Google Sheet via JSONP
            const script = document.createElement('script');
            script.src = GVIZ_JSONP_URL;
            script.async = true;
            script.onerror = function() {
                tryBackgroundFetch();
            };
            document.head.appendChild(script);

            setTimeout(() => {
                if (syncLabel.innerText.includes("Connecting")) {
                    syncLabel.innerText = "Matrix Ready (Offline Mode)";
                    syncDot.style.background = "#ffd700";
                }
            }, 1500);
        }

        async function tryBackgroundFetch() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                const response = await fetch(GVIZ_JSON_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const text = await response.text();
                    const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                    const gvizData = JSON.parse(jsonStr);
                    if (gvizData.status === 'ok') {
                        parseGVizTable(gvizData.table);
                    }
                }
            } catch (e) { /* already running with embedded/cached baseline */ }
        }

        function mergeEmbeddedSequencesIfNeeded() {
            const sample = rawSheetRows.find(r => r.id === 'B01');
            if (!sample || Object.keys(sample.sequences).length === 0) {
                const fallbackMap = getFallbackSequenceMap();
                rawSheetRows.forEach(row => {

                { id: "LOTUS_SEQUENCE", isLotusSeq: true, spatialPosition: "YA (Seat) -> SA (Crown) -> 4 Compass Lotuses -> Heart Merge -> VA", coords: [0.0, 0.0, 0.2], coordsStr: "0.0, 0.0, 0.2", siddhamUnicode: "𑖭", siddhamImage: "", dharmaObject: "Liên Hoa Bồ Đề Tâm (Four-Petal Lotus Sequence)", mantra: "A Drop of Water Falls From Crown to Seat, Growing the Four-Colored Lotus of Bodhicitta\nYA - SA - Bốn Cánh Sen Bồ Đề Tâm - Hợp Nhất - VA", sequences: { "A.Liên Hoa Bồ Đề Tâm": "19.5" } },
                { id: "HIEN_LUAN", isHienLuan: true, spatialPosition: "Heart Core (SCA) -> Crown (Z=1.0) -> Bubble of Ego Interior", coords: [0.0, 0.0, 0.0], coordsStr: "0.0, 0.0, 0.0", siddhamUnicode: "𑖭𑖿𑖓", siddhamImage: "", dharmaObject: "Hiện Luân (Manifested Wheel of Transforming Light)", mantra: "Dark Energy Drawn Inward Through the Core, Transmuted to Light, and Cast Upward to Illuminate the Bubble\nChuyển Hoá Ám Chướng Thành Quang Minh, Chiếu Sáng Khắp Bong Bóng Bản Ngã", sequences: { "A.Tổng Thể Bồ Đề Tâm": "21.6" } },
                { id: "EGO_SEQUENCE", isEgoSeq: true, spatialPosition: "BA (Sunlight) / DA (Moonlight) -- 6 Points Around the Bubble of Ego", coords: [0.0, 0.0, 0.0], coordsStr: "0.0, 0.0, 0.0", siddhamUnicode: "𑖤𑖯 / 𑖟𑖯", siddhamImage: "", dharmaObject: "Lục Đại Nhật Nguyệt (Sunlight & Moonlight Ego Sequence)", mantra: "Sunlight and Moonlight Alternate Around the Bubble of Ego as It Forms\nNhật Quang Nguyệt Quang Luân Chuyển, Bong Bóng Bản Ngã Dần Thành Hình", sequences: { "A.Tổng Thể Bồ Đề Tâm": "21.4" } }
            ];

            // 40 accurately calibrated LA spiral nodes (4 per 0.25 unit height)
            for (let i = 0; i < 40; i++) {
                const sp = getSpiralPosition(i);
                embeddedData.push({
                    id: `A${i + 1}`,
                    spatialPosition: `Spiral Light Node #${i + 1}`,
                    coords: [sp.x, sp.y, sp.z],
                    coordsStr: `${sp.x.toFixed(2)}, ${sp.y.toFixed(2)}, ${sp.z.toFixed(2)}`,

                    sequences: { "A.Tổng Thể Bồ Đề Tâm": String(i + 1), "A.Cột Trụ Quang Minh": String(i + 1) }
                });
            }

            rawSheetRows = embeddedData;
            filterColumns = [
                { label: "A.Tổng Thể Bồ Đề Tâm", index: 25 },
                { label: "A.Cột Trụ Quang Minh", index: 26 },
                { label: "A.Thường Trụ Bất Biến", index: 27 },
                { label: "A.Liên Hoa Bồ Đề Tâm", index: 28 },
                { label: "A.Lục Tý", index: 29 },
                { label: "A.Ending", index: 30 },
                { label: "A.A3/3/3", index: 31 },
                { label: "A.A4/3/3", index: 32 },
                { label: "A.A5/3/3", index: 33 },
                { label: "A.A5/5/5", index: 34 }
