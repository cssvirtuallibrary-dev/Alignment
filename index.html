            initMatrixWithParsedData();
        }

        // =========================================================================
        // SECTION 11: INTERLEAVED SPIRAL SEQUENCE ENGINE
        // Rule: 4 spiral spheres of LA, then selected matrix, then next 4 LA, etc.
        // =========================================================================
        function generateActiveSequence() {
            const selectedFilter = filterSelect.value || (filterColumns[0] ? filterColumns[0].label : '');
            const includeSpiral = includeSpiralCheckbox.checked;

            const matchingRows = rawSheetRows.filter(r => {
                return r.sequences && r.sequences[selectedFilter] !== undefined && String(r.sequences[selectedFilter]).trim().length > 0;
            });

            matchingRows.sort((a, b) => {
                return naturalCompare(a.sequences[selectedFilter], b.sequences[selectedFilter]);
            });

            // Mark all inline triggers (ego, laser, spiral, torus in, torus out)
            matchingRows.forEach(row => {
                row.triggerEgoAfter = !!(row.egoTriggers && row.egoTriggers[selectedFilter]);
                row.triggerLaserAfter = !!(row.laserTriggers && row.laserTriggers[selectedFilter]);
                row.triggerSpiralAfter = !!(row.spiralTriggers && row.spiralTriggers[selectedFilter]);
                row.triggerTorusInAfter = !!(row.torusInTriggers && row.torusInTriggers[selectedFilter]);
                row.triggerTorusOutAfter = !!(row.torusOutTriggers && row.torusOutTriggers[selectedFilter]);
                row.triggerLotusSeqAfter = !!(row.lotusSeqTriggers && row.lotusSeqTriggers[selectedFilter]);
                row.triggerHienLuanAfter = !!(row.hienLuanTriggers && row.hienLuanTriggers[selectedFilter]);
                row.triggerEgoSeqAfter = !!(row.egoSeqTriggers && row.egoSeqTriggers[selectedFilter]);
            });

            const spiralNodes = rawSheetRows.filter(r => r.id.startsWith('A')).sort((a, b) => {
                const nA = parseInt(a.id.replace(/\D/g, '')) || 0;
                const nB = parseInt(b.id.replace(/\D/g, '')) || 0;
                return nA - nB;
            });

            currentSequenceNodes = [];

            if (selectedFilter.includes("Cột Trụ Quang Minh")) {
                currentSequenceNodes = [...spiralNodes];
            } else if (includeSpiral) {
                // Interleaved 4 LA spheres, then selected matrix, then next 4 LA, etc.
                const nonSpiral = matchingRows.filter(r => !r.id.startsWith('A'));
                for (let k = 0; k < 10; k++) {
                    for (let s = 0; s < 4; s++) {
                        const sNode = spiralNodes[k * 4 + s];
                        if (sNode) currentSequenceNodes.push(sNode);
                    }
                    nonSpiral.forEach(node => currentSequenceNodes.push(node));
                }
            } else {
                currentSequenceNodes = matchingRows.filter(r => !r.id.startsWith('A'));
            }

            uiTitle.innerText = selectedFilter || "Sequence Matrix";
        }

        // Resets all secondary animations (Bubble of Ego, Laser Beams, Spiral Beams, Torus In, Torus Out)
        // leaving the Column of Light sequence intact!
        function resetSecondaryAnimations() {
            isEgoAnimating = false;
            seqEgoPending = false;
            if (egoOnCompleteCallback) egoOnCompleteCallback = null;

            isLaserAnimating = false;
            seqLaserPending = false;
            if (laserOnCompleteCallback) laserOnCompleteCallback = null;

            isSpiralAnimating = false;
            seqSpiralPending = false;
            if (spiralOnCompleteCallback) spiralOnCompleteCallback = null;

            isTorusInAnimating = false;
            seqTorusInPending = false;
            if (torusInOnCompleteCallback) torusInOnCompleteCallback = null;

            isTorusOutAnimating = false;
            seqTorusOutPending = false;
            if (torusOutOnCompleteCallback) torusOutOnCompleteCallback = null;

            // 1. Bubble of Ego:
            egoBubbleGroup.visible = false;
            outerBubble.visible = false;
            if (outerBubble.geometry !== outerBubbleGeo) {
                outerBubble.geometry.dispose();
                outerBubble.geometry = outerBubbleGeo;
            }
            const egoCb = document.getElementById('show-ego-bubble');
            if (egoCb) egoCb.checked = false;

            // 2. Laser Beams:
            laserBeamsGroup.visible = false;
            updateLaserBeamsProgress(0.001);
            const laserCb = document.getElementById('show-laser-beams');
            if (laserCb) laserCb.checked = false;

            // 3. Spiral Beams:
            spiralBeamsGroup.visible = false;
            updateSpiralBeams(0.001);
            const spiralCb = document.getElementById('show-spiral-beams');
            if (spiralCb) spiralCb.checked = false;

            // 4. Torus In:
            torusInGroup.visible = false;
            updateHornTorusSystem(torusInData, 0, 0.001);
            const torusInCb = document.getElementById('show-torus-in');
            if (torusInCb) torusInCb.checked = false;

            // 5. Torus Out:
            torusOutGroup.visible = false;
            updateHornTorusSystem(torusOutData, 0, 0.001);
            const torusOutCb = document.getElementById('show-torus-out');
            if (torusOutCb) torusOutCb.checked = false;
        }

        function resetAnimation() {
            isRunning = false;
            currentSeqIndex = -1;
            seqTimer = 0;

            // Reset secondary animations
            resetSecondaryAnimations();

            // Reset Active Actor Node:
            if (active3DActor) {
                active3DActor.group.visible = false;
                active3DActor.outline.visible = false;
                active3DActor.glow = 0.0;
                active3DActor.currentData = null;
            }

            // Column of Light is preserved and rebuilt to starting turn
            wallMesh.visible = false;
            rebuildWallGeometry();

            hidePopup();
            startBtn.innerText = "Start Formation";
        }

        async function triggerNextStep() {
            if (isEgoAnimating || isLaserAnimating || isSpiralAnimating || isTorusInAnimating || isTorusOutAnimating) return;

            if (currentSeqIndex < currentSequenceNodes.length - 1) {
                if (active3DActor) {
                    active3DActor.group.visible = false;
                    active3DActor.outline.visible = false;
                    active3DActor.glow = 0.0;
                }

                const prevNode = currentSeqIndex >= 0 ? currentSequenceNodes[currentSeqIndex] : null;
                currentSeqIndex++;
                const nodeData = currentSequenceNodes[currentSeqIndex];

                // If advancing to the next 4 LA nodes (Column of Light spiral), reset all other secondary animations!
                const isCurrentLA = nodeData && nodeData.id && nodeData.id.startsWith('A');
                const isPrevLA = prevNode && prevNode.id && prevNode.id.startsWith('A');
                if (isCurrentLA && !isPrevLA) {
                    resetSecondaryAnimations();
                }

                // Check if this step is any of the 5 dedicated animation nodes
                if (nodeData.id === 'EGO' || nodeData.isEgo) {
                    playEgoBubbleAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    return;
                }
                if (nodeData.id === 'LASER' || nodeData.isLaser) {
                    playLaserBeamsAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    return;
                }
                if (nodeData.id === 'SPIRAL' || nodeData.isSpiral) {
                    playSpiralBeamsAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    return;
                }
                if (nodeData.id === 'TORUS_IN' || nodeData.isTorusIn) {
                    playTorusInAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    return;
                }
                if (nodeData.id === 'TORUS_OUT' || nodeData.isTorusOut) {
                    playTorusOutAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    return;
                }
                if (nodeData.id === 'LOTUS_SEQUENCE' || nodeData.isLotusSeq) {
                    playLotusSequenceAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    return;
                }
                if (nodeData.id === 'HIEN_LUAN' || nodeData.isHienLuan) {
                    playHienLuanAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    return;
                }
                if (nodeData.id === 'EGO_SEQUENCE' || nodeData.isEgoSeq) {
                    playEgoSequenceAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    return;
                }

                // Check for inline triggers
                if (nodeData.triggerEgoAfter) seqEgoPending = true;
                if (nodeData.triggerLaserAfter) seqLaserPending = true;
                if (nodeData.triggerSpiralAfter) seqSpiralPending = true;
                if (nodeData.triggerTorusInAfter) seqTorusInPending = true;
                if (nodeData.triggerTorusOutAfter) seqTorusOutPending = true;
                if (nodeData.triggerLotusSeqAfter) seqLotusSeqPending = true;
                if (nodeData.triggerHienLuanAfter) seqHienLuanPending = true;
                if (nodeData.triggerEgoSeqAfter) seqEgoSeqPending = true;

                const rawCoords = nodeData.coordsStr ? parseCoordinates(nodeData.coordsStr) : nodeData.coords;
                nodeData.coords = rawCoords;

                if (active3DActor) {
                    const isGroupA = nodeData.id && nodeData.id.startsWith('A');

                    active3DActor.group.position.set(rawCoords[0], rawCoords[1], rawCoords[2]);

                    active3DActor.sphere.geometry = isGroupA ? sphereGeoA : sphereGeoB;
                    active3DActor.plane.geometry = isGroupA ? planeGeoA : planeGeoB;

                    active3DActor.currentData = nodeData;

                    // Reset 3D model container
                    while (active3DActor.modelContainer.children.length > 0) {
                        active3DActor.modelContainer.remove(active3DActor.modelContainer.children[0]);
                    }
                    active3DActor.has3DModel = false;
                    active3DActor.modelContainer.visible = false;
                    active3DActor.plane.visible = true;

                    // Load Siddham texture (cached after first fetch)
                    const tex = await loadSiddhamTexture(nodeData);
                    if (active3DActor.currentData && active3DActor.currentData.id === nodeData.id) {
                        active3DActor.planeMat.map = tex;
                        active3DActor.planeMat.needsUpdate = true;
                    }

                    // Check for C2 3D Model specification
                    if (nodeData.model3DSpec && nodeData.model3DSpec.filename) {
                        loadNode3DModel(nodeData.model3DSpec).then((mObj) => {
                            if (active3DActor.currentData && active3DActor.currentData.id === nodeData.id && mObj) {
                                while (active3DActor.modelContainer.children.length > 0) {
                                    active3DActor.modelContainer.remove(active3DActor.modelContainer.children[0]);
                                }
                                active3DActor.modelContainer.add(mObj);
                                active3DActor.has3DModel = true;
                            }
                        });
                    }

                    active3DActor.glow = 2.2;
                    active3DActor.group.visible = true;
                }

                if (includeSpiralCheckbox.checked) {
                    rebuildWallGeometry();
                }

                // Show live updated details card:
                // On Desktop/Tablet landscape: displays in RHS drawer alongside the Buddha (expanded/open)
                // On Mobile (portrait or mobile landscape): no popup drawer during automated sequence
                const isMobile = (window.innerWidth / window.innerHeight < 1.0) || window.innerHeight < 500 || window.innerWidth < 900;
                if (!isMobile || !isRunning) {
                    showPopup(nodeData);
                }
            } else {
                if (!includeSpiralCheckbox.checked) {
                    currentSeqIndex = -1;
                    triggerNextStep();
                } else {
                    isRunning = false;
                    startBtn.innerText = "Restart Formation";
                }
            }
        }

        function showPopup(data) {
            if (!data) return;

            // On mobile devices (portrait or mobile landscape): do NOT display popup for overlay animations
            const isOverlay = data.id === 'EGO' || data.isEgo || data.id === 'LASER' || data.isLaser || data.id === 'SPIRAL' || data.isSpiral || data.id === 'TORUS_IN' || data.isTorusIn || data.id === 'TORUS_OUT' || data.isTorusOut || data.id === 'LOTUS_SEQUENCE' || data.isLotusSeq || data.id === 'HIEN_LUAN' || data.isHienLuan || data.id === 'EGO_SEQUENCE' || data.isEgoSeq;
            const isMobile = (window.innerWidth / window.innerHeight < 1.0) || window.innerHeight < 500 || window.innerWidth < 900;
            if (isMobile && isOverlay) return;

            const isGroupA = data.id && data.id.startsWith('A');
            const selectedFilter = filterSelect.value;
            popupId.innerText = data.id || "-";
            popupGuidance.innerText = data.visualizationGuidance || data.spatialPosition || "Central Axis";
            
            popupCoords.innerText = `X: ${data.coords[0].toFixed(2)}, Y: ${data.coords[1].toFixed(2)}, Z: ${data.coords[2].toFixed(2)}`;
            
            const stepVal = data.sequences && data.sequences[selectedFilter] !== undefined ? `#${data.sequences[selectedFilter]}` : '-';
            popupSeqStep.innerText = `${stepVal} (${selectedFilter})`;

            popupSiddham.innerText = `${data.siddhamUnicode || ""} (${data.id})`;
            popupDharma.innerText = data.dharmaObject || "-";
            popupMantra.textContent = data.mantra || "Sacred Seed Sound";

            const box3DModelLink = document.getElementById('box-3dmodel-link');
            const popup3DLabel = document.getElementById('popup-3dmodel-label');
            const popup3DColor = document.getElementById('popup-3dmodel-color');

            if (data.id === 'EGO' || data.isEgo || data.id === 'LASER' || data.isLaser || data.id === 'SPIRAL' || data.isSpiral || data.id === 'TORUS_IN' || data.isTorusIn || data.id === 'TORUS_OUT' || data.isTorusOut || data.id === 'LOTUS_SEQUENCE' || data.isLotusSeq || data.id === 'HIEN_LUAN' || data.isHienLuan || data.id === 'EGO_SEQUENCE' || data.isEgoSeq) {
                boxSiddhamImg.style.display = 'none';
                if (box3DModelLink) box3DModelLink.style.display = 'none';
            } else {
                const sUrl = formatImageUrl(data.siddhamImage, data.id);
                if (sUrl) {
                    popupSiddhamImg.src = sUrl;
                    popupSiddhamImg.onerror = () => {
                        const fid = extractGoogleDriveFileId(data.siddhamImage);
                        if (fid) {
                            popupSiddhamImg.src = `https://lh3.googleusercontent.com/d/${fid}`;
                        } else if (isGroupA) {
                            popupSiddhamImg.src = '06_LA_Gold.PNG';
                        } else if (canonicalSiddhamFiles[data.id]) {
                            popupSiddhamImg.src = canonicalSiddhamFiles[data.id];
                        }
                    };
                    boxSiddhamImg.style.display = 'block';
                } else {
                    boxSiddhamImg.style.display = 'none';
                }

                if (box3DModelLink && data.model3DSpec && data.model3DSpec.filename) {
                    box3DModelLink.style.display = 'block';
                    if (popup3DLabel) popup3DLabel.innerText = data.model3DSpec.filename;
                    if (popup3DColor) {
                        popup3DColor.innerText = data.model3DSpec.colorName ? `Color: ${data.model3DSpec.colorName}` : 'Color: Native';
                    }
                } else if (box3DModelLink) {
                    box3DModelLink.style.display = 'none';
                }
            }

            popupCard.classList.add('active');
        }

        function hidePopup() {
            popupCard.classList.remove('active');
            if (active3DActor) active3DActor.outline.visible = false;
        }

        document.getElementById('popup-close').addEventListener('click', (e) => {
            e.stopPropagation();
            hidePopup();
            // If sequence was paused by tapping on a sphere, resume automatically on closing popup!
            if (pausedBySphereSelection && isRunning) {
                isPaused = false;
                pausedBySphereSelection = false;
                updatePlayPauseBtnUI();
            }
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handlePointerDown(event) {
            if (event.target.closest('#ui-container') || event.target.closest('#popup-card') || event.target.closest('#top-bar')) return;
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (active3DActor && active3DActor.group.visible) {
                const intersects = raycaster.intersectObjects([active3DActor.sphere, active3DActor.plane]);
                if (intersects.length > 0) {
                    // Selected Siddham sphere: pause animation and show detail popup!
                    if (isRunning && !isPaused) {
                        isPaused = true;
                        pausedBySphereSelection = true;
                        updatePlayPauseBtnUI();
                    }
                    showPopup(active3DActor.currentData);
                    active3DActor.outline.visible = true;
                    return;
                }
            }
        }
        window.addEventListener('pointerdown', handlePointerDown);

        // Animation Playback Controls State
        let isPaused = false;
        let pausedBySphereSelection = false;
        let animSpeedMultiplier = 1.0;

        const btnStepPrev = document.getElementById('btn-step-prev');
        const btnPlayPause = document.getElementById('btn-play-pause');
        const btnStepNext = document.getElementById('btn-step-next');
        const animSpeedSelect = document.getElementById('anim-speed-select');

        function updatePlayPauseBtnUI() {
            if (!btnPlayPause) return;
            if (isPaused) {
                btnPlayPause.innerHTML = '&#9654;'; // Play icon
                btnPlayPause.title = "Resume Animation";
            } else {
                btnPlayPause.innerHTML = '&#10074;&#10074;'; // Pause icon
                btnPlayPause.title = "Pause / Stop Animation";
            }
        }

        if (animSpeedSelect) {
            animSpeedSelect.addEventListener('change', (e) => {
                animSpeedMultiplier = parseFloat(e.target.value) || 1.0;
            });
        }

        if (btnPlayPause) {
            btnPlayPause.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!isRunning) {
                    startBtn.click();
                    return;
                }
                isPaused = !isPaused;
                pausedBySphereSelection = false;
                updatePlayPauseBtnUI();
            });
        }

        if (btnStepPrev) {
            btnStepPrev.addEventListener('click', (e) => {
                e.stopPropagation();
                stepReverse();
            });
        }

        if (btnStepNext) {
            btnStepNext.addEventListener('click', (e) => {
                e.stopPropagation();
                triggerNextStep();
            });
        }

        function stepReverse() {
            if (!currentSequenceNodes || currentSequenceNodes.length === 0) return;
            isPaused = true;
            updatePlayPauseBtnUI();

            if (currentSeqIndex > 0) {
                currentSeqIndex -= 2; // Subtract 2 because triggerNextStep increments by 1
                seqTimer = 0;
                triggerNextStep();
            } else if (currentSeqIndex === 0) {
                currentSeqIndex = -1;
                seqTimer = 0;
                triggerNextStep();
            }
        }

        // Direct File Picker & Drag-and-Drop for Buddha 3D Model (.glb)
        const btnCustomBuddha = document.getElementById('btn-custom-buddha');
        const inputBuddhaFile = document.getElementById('input-buddha-file');

        if (btnCustomBuddha && inputBuddhaFile) {
            btnCustomBuddha.addEventListener('click', (e) => {
                e.stopPropagation();
                inputBuddhaFile.click();
            });

            inputBuddhaFile.addEventListener('change', async (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    const file = e.target.files[0];
                    const buffer = await file.arrayBuffer();
                    const loader = new THREE.GLTFLoader();
                    loader.parse(buffer, '', (gltf) => {
                        if (gltf && gltf.scene) {
                            applyBuddhaGLTFScene(gltf.scene);
                            btnCustomBuddha.innerText = `✓ Loaded: ${file.name.slice(0, 14)}...`;
                        }
                    });
                }
            });
        }

        // Drag-and-drop any .glb / .gltf file directly into the 3D viewport
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', async (e) => {
            e.preventDefault();
            if (e.dataTransfer && e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                const fname = file.name.toLowerCase();
                if (fname.endsWith('.glb') || fname.endsWith('.gltf')) {
                    const buffer = await file.arrayBuffer();
                    const loader = new THREE.GLTFLoader();
                    loader.parse(buffer, '', (gltf) => {
                        if (gltf && gltf.scene) {
                            applyBuddhaGLTFScene(gltf.scene);
                            if (btnCustomBuddha) {
                                btnCustomBuddha.innerText = `✓ Loaded: ${file.name.slice(0, 14)}...`;
                            }
                        }
                    });
                }
            }
        });

        // =========================================================================
        // SECTION 13: UI EVENT LISTENERS
        // =========================================================================
        startBtn.addEventListener('click', () => {
            if (isRunning) {
                resetAnimation();
                isPaused = false;
                pausedBySphereSelection = false;
                updatePlayPauseBtnUI();
            } else {
                resetAnimation();
                generateActiveSequence();
                isRunning = true;
                isPaused = false;
                pausedBySphereSelection = false;
                updatePlayPauseBtnUI();
                wallMesh.visible = includeSpiralCheckbox.checked;
                startBtn.innerText = "Reset / Restart";

                // On mobile devices (portrait or mobile landscape), collapse filter panel to header.
                // On Desktop and Tablet landscape, leave both LHS and RHS drawers expanded/open!
                const isMobileDevice = (window.innerWidth / window.innerHeight < 1.0) || window.innerHeight < 500 || window.innerWidth < 900;
                if (isMobileDevice) {
                    uiContainer.classList.add('collapsed');
                    uiToggleBtn.innerText = '▼';
                    uiTitle.innerText = filterSelect.value || "Sequence Matrix";
                } else {
                    uiContainer.classList.remove('collapsed');
                    uiToggleBtn.innerText = '▲';
                    uiTitle.innerText = "Sequence Matrix";
                }

                triggerNextStep();
            }
        });

        filterSelect.addEventListener('change', () => {
            const isMobileDevice = (window.innerWidth / window.innerHeight < 1.0) || window.innerHeight < 500 || window.innerWidth < 900;
            if (isMobileDevice) {
                uiContainer.classList.add('collapsed');
                uiToggleBtn.innerText = '▼';
                uiTitle.innerText = filterSelect.value;
            } else {
                uiContainer.classList.remove('collapsed');
                uiToggleBtn.innerText = '▲';
                uiTitle.innerText = "Sequence Matrix";
            }
            resetAnimation();
            generateActiveSequence();
        });

        includeSpiralCheckbox.addEventListener('change', () => {
            wallMesh.visible = includeSpiralCheckbox.checked && isRunning;
            resetAnimation();
            generateActiveSequence();
        });

        const showEgoBubbleCheckbox = document.getElementById('show-ego-bubble');
        const animateEgoBtn = document.getElementById('animate-ego-btn');

        if (showEgoBubbleCheckbox) {
            showEgoBubbleCheckbox.addEventListener('change', (e) => {
                egoBubbleGroup.visible = e.target.checked;
                outerBubble.visible = e.target.checked;
                if (e.target.checked && outerBubble.geometry !== outerBubbleGeo) {
                    outerBubble.geometry.dispose();
                    outerBubble.geometry = outerBubbleGeo;
                }
            });
        }

        if (animateEgoBtn) {
            animateEgoBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playEgoBubbleAnimation();
            });
        }

        const showLaserBeamsCheckbox = document.getElementById('show-laser-beams');
        const animateLaserBtn = document.getElementById('animate-laser-btn');

        if (showLaserBeamsCheckbox) {
            showLaserBeamsCheckbox.addEventListener('change', (e) => {
                laserBeamsGroup.visible = e.target.checked;
                if (e.target.checked) updateLaserBeamsProgress(1.0);
            });
        }

        if (animateLaserBtn) {
            animateLaserBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playLaserBeamsAnimation();
            });
        }

        const showSpiralBeamsCheckbox = document.getElementById('show-spiral-beams');
        const animateSpiralBtn = document.getElementById('animate-spiral-beams-btn');

        if (showSpiralBeamsCheckbox) {
            showSpiralBeamsCheckbox.addEventListener('change', (e) => {
                spiralBeamsGroup.visible = e.target.checked;
                if (e.target.checked) updateSpiralBeams(1.0);
            });
        }

        if (animateSpiralBtn) {
            animateSpiralBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playSpiralBeamsAnimation();
            });
        }

        const showTorusInCheckbox = document.getElementById('show-torus-in');
        const animateTorusInBtn = document.getElementById('animate-torus-in-btn');

        if (showTorusInCheckbox) {
            showTorusInCheckbox.addEventListener('change', (e) => {
                torusInGroup.visible = e.target.checked;
                if (e.target.checked) updateHornTorusSystem(torusInData, 0, 1.0);
            });
        }

        if (animateTorusInBtn) {
            animateTorusInBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playTorusInAnimation();
            });
        }

        const showTorusOutCheckbox = document.getElementById('show-torus-out');
        const animateTorusOutBtn = document.getElementById('animate-torus-out-btn');

        if (showTorusOutCheckbox) {
            showTorusOutCheckbox.addEventListener('change', (e) => {
                torusOutGroup.visible = e.target.checked;
                if (e.target.checked) updateHornTorusSystem(torusOutData, 0, 1.0);
            });
        }

        if (animateTorusOutBtn) {
            animateTorusOutBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playTorusOutAnimation();
            });
        }

        const animateLotusSeqBtn = document.getElementById('animate-lotus-seq-btn');
        if (animateLotusSeqBtn) {
            animateLotusSeqBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playLotusSequenceAnimation();
            });
        }

        const animateHienLuanBtn = document.getElementById('animate-hien-luan-btn');
        if (animateHienLuanBtn) {
            animateHienLuanBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playHienLuanAnimation();
            });
        }

        const animateEgoSeqBtn = document.getElementById('animate-ego-seq-btn');
        if (animateEgoSeqBtn) {
            animateEgoSeqBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playEgoSequenceAnimation();
            });
        }

        showAxesCheckbox.addEventListener('change', (e) => {
            axesGroup.visible = e.target.checked;
        });

        showGridMarkersCheckbox.addEventListener('change', (e) => {
            gridMarkersGroup.visible = e.target.checked;
        });

        uiHeader.addEventListener('click', () => {
            const isCollapsed = uiContainer.classList.toggle('collapsed');
            uiToggleBtn.innerText = isCollapsed ? '▼' : '▲';
            if (isCollapsed) {
                uiTitle.innerText = filterSelect.value || "Sequence Matrix";
            } else {
                uiTitle.innerText = "Sequence Matrix";
            }
        });

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateResponsiveCamera();
        });

        // =========================================================================
        // SECTION 14: ANIMATION LOOP
        // =========================================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            const glowVal = parseFloat(glowIntensityInput.value);
            coreLight.intensity = (Math.sin(elapsedTime * 2) * 0.4 + 1.2) * glowVal;
            coreLight.position.z = Math.sin(elapsedTime * 0.6) * 0.4;

            // 1. Advance Bubble of Ego animation (clear crystal bubble, no blue lines)
            if (isEgoAnimating) {
                const elapsed = (performance.now() - egoAnimStartTime) / 1000;
                const t = Math.min(1.0, elapsed / egoAnimDuration);
                const u = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                updateEgoBubbleWrapping(u);

                if (t >= 1.0) {
                    isEgoAnimating = false;
                    setTimeout(() => {
                        if (egoOnCompleteCallback) {
                            const cb = egoOnCompleteCallback;
                            egoOnCompleteCallback = null;
                            cb();
                        }
                    }, 1200);
                }
            }

            // 2. Advance Laser Beams of Light animation
            if (isLaserAnimating) {
                const elapsed = (performance.now() - laserAnimStartTime) / 1000;
                const t = Math.min(1.0, elapsed / laserAnimDuration);
                const progress = 1 - Math.pow(1 - t, 3);
                updateLaserBeamsProgress(progress);

                if (t >= 1.0) {
                    isLaserAnimating = false;
                    setTimeout(() => {
                        if (laserOnCompleteCallback) {
                            const cb = laserOnCompleteCallback;
                            laserOnCompleteCallback = null;
                            cb();
                        }
                    }, 1200);
                }
            }

            // 3. Advance Spiral Beams animation (origin 0,0,0 outward along 6 cardinal helixes)
            if (isSpiralAnimating) {
                const elapsed = (performance.now() - spiralAnimStartTime) / 1000;
                const t = Math.min(1.0, elapsed / spiralAnimDuration);
                const progress = 1 - Math.pow(1 - t, 3);
                updateSpiralBeams(progress, elapsedTime * 4.0);

                if (t >= 1.0) {
                    isSpiralAnimating = false;
                    setTimeout(() => {
                        if (spiralOnCompleteCallback) {
                            const cb = spiralOnCompleteCallback;
                            spiralOnCompleteCallback = null;
                            cb();
                        }
                    }, 1200);
                }
            } else if (spiralBeamsGroup.visible) {
                // Continuous dynamic helical ripple while visible
                updateSpiralBeams(1.0, elapsedTime * 4.0);
            }

            // 4. Advance Torus In energy flow (Crown -> Core -> Seat, within bubble)
            if (isTorusInAnimating) {
                const elapsed = (performance.now() - torusInStartTime) / 1000;
                const t = Math.min(1.0, elapsed / torusInDuration);
                const progress = 1 - Math.pow(1 - t, 2.5);
                const flowOffset = (elapsedTime * 0.45) % 1.0;
                updateHornTorusSystem(torusInData, flowOffset, progress);

                if (t >= 1.0) {
                    isTorusInAnimating = false;
                    setTimeout(() => {
                        if (torusInOnCompleteCallback) {
                            const cb = torusInOnCompleteCallback;
                            torusInOnCompleteCallback = null;
                            cb();
                        }
                    }, 1200);
                }
            } else if (torusInGroup.visible) {
                const flowOffset = (elapsedTime * 0.45) % 1.0;
                updateHornTorusSystem(torusInData, flowOffset, 1.0);
            }

            // 5. Advance Torus Out energy flow (Crown -> Expanding beyond bubble -> Seat)
            if (isTorusOutAnimating) {
                const elapsed = (performance.now() - torusOutStartTime) / 1000;
                const t = Math.min(1.0, elapsed / torusOutDuration);
                const progress = 1 - Math.pow(1 - t, 2.5);
                const flowOffset = (elapsedTime * 0.40) % 1.0;
                updateHornTorusSystem(torusOutData, flowOffset, progress);

                if (t >= 1.0) {
                    isTorusOutAnimating = false;
                    setTimeout(() => {
                        if (torusOutOnCompleteCallback) {
                            const cb = torusOutOnCompleteCallback;
                            torusOutOnCompleteCallback = null;
                            cb();
                        }
                    }, 1200);
                }
            } else if (torusOutGroup.visible) {
                const flowOffset = (elapsedTime * 0.40) % 1.0;
                updateHornTorusSystem(torusOutData, flowOffset, 1.0);
            }

            // 6. Advance Lotus Sequence (+LOTUS_SEQUENCE)
            if (isLotusSeqAnimating) {
                const elapsed = (performance.now() - lotusSeqStartTime) / 1000;
                if (lotusSeqInstance) lotusSeqInstance.update(elapsed);
                if (elapsed >= LOTUS_SEQ_DURATION) {
                    isLotusSeqAnimating = false;
                    setTimeout(() => {
                        if (lotusSeqOnComplete) {
                            const cb = lotusSeqOnComplete;
                            lotusSeqOnComplete = null;
                            cb();
                        }
                    }, 800);
                }
            } else if (lotusSeqInstance) {
                lotusSeqInstance.update(0);
            }

            // 7. Advance Hien Luan (+HIEN_LUAN)
            if (isHienLuanAnimating) {
                const elapsed = (performance.now() - hienLuanStartTime) / 1000;
                if (hienLuanInstance) hienLuanInstance.update(elapsed);
                if (elapsed >= HIEN_LUAN_DURATION) {
                    isHienLuanAnimating = false;
                    setTimeout(() => {
                        if (hienLuanOnComplete) {
                            const cb = hienLuanOnComplete;
                            hienLuanOnComplete = null;
                            cb();
                        }
                    }, 800);
                }
            } else if (hienLuanInstance) {
                hienLuanInstance.update(0);
            }

            // 8. Advance Ego Sequence (+EGO_SEQUENCE)
            if (isEgoSeqAnimating) {
                const elapsed = (performance.now() - egoSeqStartTime) / 1000;
                if (egoSeqInstance) egoSeqInstance.update(elapsed);
                if (elapsed >= EGO_SEQ_DURATION) {
                    isEgoSeqAnimating = false;
                    setTimeout(() => {
                        if (egoSeqOnComplete) {
                            const cb = egoSeqOnComplete;
                            egoSeqOnComplete = null;
                            cb();
                        }
                    }, 800);
                }
            } else if (egoSeqInstance) {
                egoSeqInstance.update(0);
            }

            // Sequential matrix controller: dispatch inline pending animations before next node
            const anyCustomAnimRunning = isEgoAnimating || isLaserAnimating || isSpiralAnimating || isTorusInAnimating || isTorusOutAnimating || isLotusSeqAnimating || isHienLuanAnimating || isEgoSeqAnimating;

            if (isRunning && !anyCustomAnimRunning && !isPaused) {
                seqTimer += delta * animSpeedMultiplier;
                if (seqTimer >= nodeInterval) {
                    seqTimer = 0;
                    if (seqLaserPending) {
                        seqLaserPending = false;
                        playLaserBeamsAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    } else if (seqSpiralPending) {
                        seqSpiralPending = false;
                        playSpiralBeamsAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    } else if (seqTorusInPending) {
                        seqTorusInPending = false;
                        playTorusInAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    } else if (seqTorusOutPending) {
                        seqTorusOutPending = false;
                        playTorusOutAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    } else if (seqEgoPending) {
                        seqEgoPending = false;
                        playEgoBubbleAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    } else if (seqLotusSeqPending) {
                        seqLotusSeqPending = false;
                        playLotusSequenceAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    } else if (seqHienLuanPending) {
                        seqHienLuanPending = false;
                        playHienLuanAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    } else if (seqEgoSeqPending) {
                        seqEgoSeqPending = false;
                        playEgoSequenceAnimation(() => { seqTimer = 0; triggerNextStep(); });
                    } else {
                        triggerNextStep();
                    }
                }
                if (includeSpiralCheckbox.checked) {
                    wallMaterial.opacity = (0.35 + Math.sin(elapsedTime * 3.0) * 0.1) * glowVal;
                }
            }

            const rpm = parseFloat(rotationSpeedInput.value);
            const rotationStep = ((rpm * Math.PI * 2) / 60) * delta;
            nodesGroup.rotation.z += rotationStep;
            buddhaGroup.rotation.z += rotationStep;

            if (active3DActor && active3DActor.group.visible) {
                active3DActor.glow = THREE.MathUtils.lerp(active3DActor.glow, 1.0, 0.05);

                const pulseScale = 1.0 + (Math.sin(elapsedTime * 3.0) * 0.04);
                active3DActor.sphere.scale.setScalar(pulseScale);

                // Alternating display: If a C2 3D model is available, alternate every 2.5 seconds
                if (active3DActor.has3DModel) {
                    const show3D = (Math.floor(elapsedTime / 2.5) % 2) === 1;
                    active3DActor.modelContainer.visible = show3D;
                    active3DActor.plane.visible = !show3D;
                } else {
                    active3DActor.modelContainer.visible = false;
                    active3DActor.plane.visible = true;
                }

                // Billboard (Face Camera) is the default mode
                if (billboardModeSelect.value === 'billboard') {
                    active3DActor.spinPivot.rotation.set(0, 0, 0);
                    active3DActor.plane.quaternion.copy(camera.quaternion);
                    active3DActor.outline.quaternion.copy(camera.quaternion);
                    if (active3DActor.has3DModel && active3DActor.modelContainer.visible) {
                        active3DActor.modelContainer.rotation.y = elapsedTime * 1.5; // Smooth turntable rotation
                    }
                } else {
                    active3DActor.plane.rotation.set(Math.PI / 2, 0, 0);
                    active3DActor.outline.rotation.set(Math.PI / 2, 0, 0);
                    active3DActor.spinPivot.rotation.set(0, 0, elapsedTime * 1.6);
                    if (active3DActor.has3DModel && active3DActor.modelContainer.visible) {
                        active3DActor.modelContainer.rotation.y = elapsedTime * 1.5;
                    }
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Start ingestion pipeline immediately
        startDataIngestion();
        animate();
    </script>
</body>
</html>
