<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lotus Bodhicitta System</title>
    <style>
        :root {
            --bg-dark: #020409;
            --panel-bg: rgba(6, 12, 24, 0.90);
            --panel-border: rgba(255, 215, 0, 0.28);
            --accent-gold: #ffd700;
            --accent-gold-bright: #fff07a;
            --accent-cyan: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #8fa0b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #081122 0%, #03060d 60%, #010206 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main); user-select: none; -webkit-user-select: none;
        }

        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Floating Top Control Bar */
        #top-bar {
            position: absolute; top: env(safe-area-inset-top, 16px); left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 30;
        }

        #start-btn {
            pointer-events: auto;
            background: linear-gradient(135deg, #ffd700 0%, #ff9900 100%);
            color: #03060d; border: 1px solid rgba(255, 240, 120, 0.85);
            padding: 11px 22px; border-radius: 12px; font-weight: 800; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1.4px; font-size: 11px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.45), inset 0 1px 1px rgba(255,255,255,0.6);
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
        }
        #start-btn:hover {
            background: linear-gradient(135deg, #fff07a 0%, #ffaa00 100%);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.7);
            transform: translateY(-2px);
        }
        #start-btn:active { transform: translateY(1px); }

        #sync-status {
            pointer-events: auto;
            display: flex; align-items: center; gap: 8px;
            background: rgba(4, 9, 18, 0.85); border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 7px 14px; border-radius: 20px; font-size: 11px; color: var(--text-muted);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        #sync-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }

        /* Collapsible Filter Panel */
        #ui-container {
            position: absolute; top: calc(env(safe-area-inset-top, 16px) + 54px); left: 16px;
            background: var(--panel-bg); padding: 14px 18px; border-radius: 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75); border: 1px solid var(--panel-border);
            width: 310px; pointer-events: auto;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1); z-index: 25;
        }
        #ui-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        h1 { font-size: 13px; margin: 0; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 800; }
        #ui-toggle-btn { background: none; border: none; color: var(--accent-gold); font-size: 12px; cursor: pointer; padding: 4px; transition: transform 0.3s ease; }
        #ui-content { margin-top: 12px; transition: max-height 0.3s ease, opacity 0.3s ease; max-height: 520px; opacity: 1; overflow: hidden; }

        /* Collapsed Filter Box: ONLY displays selected sequence matrix name */
        #ui-container.collapsed { width: auto; max-width: 280px; padding: 10px 14px; }
        #ui-container.collapsed #ui-header h1 { font-size: 11px; color: var(--accent-gold-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #ui-container.collapsed #ui-toggle-btn { transform: rotate(-90deg); margin-left: 10px; }
        #ui-container.collapsed #ui-content { max-height: 0; opacity: 0; margin-top: 0; pointer-events: none; }

        .control-group { margin-bottom: 11px; }
        label { display: block; font-size: 10px; color: #8fa0b8; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; }
        select, input[type="range"] {
            width: 100%; background: #0c1524; border: 1px solid #1c2b42; color: #fff;
            padding: 8px 10px; border-radius: 7px; outline: none; box-sizing: border-box; font-size: 11px;
            transition: border-color 0.2s;
        }
        select:focus { border-color: var(--accent-gold); }

        .checkbox-container { display: flex; align-items: center; gap: 8px; margin-top: 6px; cursor: pointer; }
        .checkbox-container input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--accent-gold); cursor: pointer; }
        .checkbox-container span { font-size: 11px; color: #e2e8f0; letter-spacing: 0.3px; }

        details { background: rgba(12, 21, 36, 0.5); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 7px 10px; margin-top: 8px; }
        summary { font-size: 10px; color: var(--accent-gold); cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; outline: none; }

        /* Siddham Node Details Card (Non-blocking, right on Desktop, bottom on Mobile) */
        #popup-card {
            position: absolute;
            background: rgba(6, 12, 24, 0.94); border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 16px; padding: 16px 20px;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85), 0 0 25px rgba(255, 215, 0, 0.12);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.3s ease;
            opacity: 0; pointer-events: none; z-index: 28; max-height: 80vh; overflow-y: auto;
        }
        #popup-card.active { opacity: 1; pointer-events: auto; }
        #popup-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: #8fa0b8; font-size: 18px; cursor: pointer; padding: 4px; line-height: 1; }
        #popup-close:hover { color: #fff; }
        #popup-title {
            color: var(--accent-gold); margin: 0 0 10px 0; font-size: 13px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2); padding-bottom: 6px;
        }
        .popup-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 11px; }
        .popup-label { color: #8fa0b8; font-weight: 600; }
        .popup-val { font-weight: 700; color: #fff; text-align: right; max-width: 65%; }

        .popup-images { display: flex; gap: 10px; margin: 10px 0; }
        .popup-img-box {
            flex: 1; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,215,0,0.22);
            border-radius: 8px; padding: 6px; text-align: center;
        }
        .popup-img-box span { font-size: 9px; color: var(--accent-gold); display: block; margin-bottom: 4px; text-transform: uppercase; font-weight: 600; }
        .popup-img-box img { max-width: 100%; height: 75px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255,215,0,0.45)); }

        .popup-mantra-section { margin-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 8px; }
        .popup-mantra-val {
            font-family: Georgia, Cambria, 'Times New Roman', serif; font-style: italic;
            font-size: 11.5px; line-height: 1.5; color: var(--accent-gold-bright);
            background: rgba(255, 215, 0, 0.05); border-left: 2px solid var(--accent-gold);
            padding: 8px 12px; border-radius: 0 8px 8px 0; white-space: pre-line;
        }

        /* Landscape / Desktop / Tablet */
        @media (min-width: 768px) and (orientation: landscape), (min-aspect-ratio: 1/1) and (min-width: 640px) {
            #popup-card {
                top: calc(env(safe-area-inset-top, 16px) + 54px);
                right: 16px; width: 330px;
                transform: translateX(40px);
            }
            #popup-card.active { transform: translateX(0); }
        }

        /* Portrait Mobile Phone */
        @media (max-width: 767px) and (orientation: portrait), (max-aspect-ratio: 1/1) {
            #top-bar { top: env(safe-area-inset-top, 12px); left: 12px; right: 12px; }
            #ui-container {
                top: calc(env(safe-area-inset-top, 12px) + 50px); left: 12px;
                width: calc(100vw - 24px); max-width: none;
            }
            #ui-container.collapsed { max-width: calc(100vw - 24px); width: calc(100vw - 24px); }

            #popup-card {
                bottom: env(safe-area-inset-bottom, 12px); left: 12px; right: 12px;
                width: auto; max-width: none; max-height: 38vh;
                transform: translateY(30px);
                padding: 12px 16px;
            }
            #popup-card.active { transform: translateY(0); }
            .popup-img-box img { height: 55px; }
            .popup-row { margin-bottom: 4px; font-size: 10.5px; }
            .popup-mantra-val { font-size: 10.5px; padding: 6px 10px; }
        }

        /* Loading Screen */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #020409; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; transition: opacity 0.5s ease;
        }
        .spinner {
            width: 46px; height: 46px; border: 2px solid rgba(255, 215, 0, 0.15);
            border-top-color: var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { margin-top: 18px; color: var(--accent-gold); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; }
    </style>

    <!-- Three.js + Controls + Loaders -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Initializing Sacred Bodhicitta Matrix...</div>
    </div>

    <div id="top-bar">
        <button id="start-btn">Start Formation</button>
        <div id="sync-status">
            <span id="sync-dot"></span>
            <span id="sync-label">Connecting Sheet...</span>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- Collapsible UI Filter Panel -->
    <div id="ui-container">
        <div id="ui-header">
            <h1 id="ui-title">Sequence Matrix</h1>
            <button id="ui-toggle-btn">▲</button>
        </div>
        <div id="ui-content">
            <div class="control-group">
                <label>Filter Sequence Matrix ("A.xx" Only)</label>
                <select id="filter-select">
                    <option value="" disabled selected>Loading sequences...</option>
                </select>
            </div>

            <div class="control-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="include-spiral" checked>
                    <span>Include Column of Light Spiral</span>
                </label>
            </div>

            <div class="control-group">
                <label>Auto-Rotation Speed (RPM)</label>
                <input type="range" id="rotation-speed" min="0" max="10" step="0.1" value="0">
            </div>

            <div class="control-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="show-axes">
                    <span>Show Coordination Axes</span>
                </label>
            </div>

            <div class="control-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="show-grid-markers">
                    <span>Show 0.5 Unit Markers</span>
                </label>
            </div>

            <details>
                <summary>Character Render Mode</summary>
                <div style="margin-top: 8px;">
                    <select id="billboard-mode">
                        <option value="rotate" selected>Vertical Z-Axis Spin</option>
                        <option value="billboard">Face Camera (Billboard)</option>
                    </select>
                </div>
            </details>

            <details style="margin-top: 8px;">
                <summary>Core Glow Intensity</summary>
                <div style="margin-top: 8px;">
                    <input type="range" id="glow-intensity" min="0" max="3" step="0.1" value="1.5">
                </div>
            </details>
        </div>
    </div>

    <!-- Siddham Node Details Card -->
    <div id="popup-card">
        <button id="popup-close">&times;</button>
        <div id="popup-title">Siddham Node Details</div>
        <div class="popup-row"><span class="popup-label">WBS ID:</span><span class="popup-val" id="popup-id">-</span></div>
        <div class="popup-row"><span class="popup-label">Spatial Position:</span><span class="popup-val" id="popup-position">-</span></div>
        <div class="popup-row"><span class="popup-label">A2 Lý Coordinate:</span><span class="popup-val" id="popup-coords">-</span></div>
        <div class="popup-row"><span class="popup-label">Sequence Step:</span><span class="popup-val" id="popup-seq-step">-</span></div>
        <div class="popup-row"><span class="popup-label">Siddham:</span><span class="popup-val" id="popup-siddham">-</span></div>
        <div class="popup-row"><span class="popup-label">Dharma Object:</span><span class="popup-val" id="popup-dharma">-</span></div>

        <div class="popup-images">
            <div class="popup-img-box" id="box-siddham-img">
                <span>Siddham Image (C4 CTT Link)</span>
                <img id="popup-siddham-img" src="" alt="Siddham">
            </div>
        </div>

        <div class="popup-mantra-section">
            <div class="popup-label" style="margin-bottom: 4px; text-transform: uppercase; font-size: 9.5px; letter-spacing: 0.6px;">Sacred Mantra:</div>
            <div class="popup-mantra-val" id="popup-mantra">-</div>
        </div>
    </div>

    <script>
        // =========================================================================
        // SECTION 1: GLOBAL STATE & CANONICAL SIDDHAM REGISTRY
        // =========================================================================
        const SHEET_ID = '1Gvl7SNXhVSrKBJiPgt78T2opWckb5OO59S-q_4S6Y7w';
        const SHEET_TAB = 'WBSID';
        const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_TAB)}`;

        let rawSheetRows = [];
        let filterColumns = [];
        let currentSequenceNodes = [];
        let currentSeqIndex = -1;
        let isRunning = false;
        let seqTimer = 0;
        const nodeInterval = 2.4;

        let active3DActor = null;
        let isOverlayDismissed = false;

        // DOM elements
        const container = document.getElementById('canvas-container');
        const startBtn = document.getElementById('start-btn');
        const syncLabel = document.getElementById('sync-label');
        const syncDot = document.getElementById('sync-dot');
        const filterSelect = document.getElementById('filter-select');
        const uiContainer = document.getElementById('ui-container');
        const uiHeader = document.getElementById('ui-header');
        const uiTitle = document.getElementById('ui-title');
        const uiToggleBtn = document.getElementById('ui-toggle-btn');
        const rotationSpeedInput = document.getElementById('rotation-speed');
        const billboardModeSelect = document.getElementById('billboard-mode');
        const glowIntensityInput = document.getElementById('glow-intensity');
        const includeSpiralCheckbox = document.getElementById('include-spiral');
        const showAxesCheckbox = document.getElementById('show-axes');
        const showGridMarkersCheckbox = document.getElementById('show-grid-markers');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');

        // Details Popup Card Elements
        const popupCard = document.getElementById('popup-card');
        const popupId = document.getElementById('popup-id');
        const popupPosition = document.getElementById('popup-position');
        const popupCoords = document.getElementById('popup-coords');
        const popupSeqStep = document.getElementById('popup-seq-step');
        const popupSiddham = document.getElementById('popup-siddham');
        const popupDharma = document.getElementById('popup-dharma');
        const popupMantra = document.getElementById('popup-mantra');
        const popupSiddhamImg = document.getElementById('popup-siddham-img');
        const boxSiddhamImg = document.getElementById('box-siddham-img');

        function hideLoadingOverlay() {
            if (isOverlayDismissed) return;
            isOverlayDismissed = true;
            if (loadingOverlay) {
                loadingOverlay.style.opacity = '0';
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 500);
            }
        }

        // FAIL-SAFE: Under no circumstance allow initialization to block longer than 2.0s
        setTimeout(() => {
            if (!isOverlayDismissed) {
                console.warn("Safety timeout fired: dismissing initialization overlay.");
                hideLoadingOverlay();
            }
        }, 2000);

        // Canonical mapping of WBS IDs to their known Siddham Gold PNG files
        const canonicalSiddhamFiles = {
            "B01": "01_A_Gold.png",   "B02": "03_PA_Gold.png",  "B03": "02_RA_Gold.png",
            "B04": "36_NNA_Gold.png", "B05": "10_SSA_Gold.png", "B06": "11_VA_Gold.png",
            "B07": "09_DDA_Gold.png", "B08": "13_YA_Gold.png",  "B09": "04_CA_Gold.png",
            "B10": "16_SA_Gold.png",  "B11": "08_BA_Gold.png",  "B12": "09_DDA_Gold.png",
            "B13": "25_KSSA_Gold.png","B14": "04_CA_Gold.png",  "B15": "18_GA_Gold.png",
            "B16": "08_BA_Gold.png",  "B17": "09_DDA_Gold.png", "B18": "21_SVA_Gold.png",
            "B19": "04_CA_Gold.png",  "B20": "19_THA_Gold.png", "B21": "08_BA_Gold.png",
            "B22": "11_VA_Gold.png",  "B23": "33_TSA_Gold.png", "B24": "14_SSTTA_Gold.png",
            "B25": "39_YSA_Gold.png", "B26": "34_GHA_Gold.png", "B27": "07_DA_Gold.png",
            "B28": "16_SA_Gold.png",  "B29": "08_BA_Gold.png",  "B30": "09_DDA_Gold.png",
            "B31": "42_DDHA_Gold.png","B32": "24_KHA_Gold.png", "B33": "01_A_Gold.png",
            "B34": "37_PHA_Gold.png"
        };

        // =========================================================================
        // SECTION 2: THREE.JS SCENE SETUP (+X: Right, +Y: Front, +Z: Up)
        // =========================================================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020409, 0.022);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.up.set(0, 0, 1);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 25;
        controls.minDistance = 1.2;

        function updateResponsiveCamera() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;

            if (aspect < 1.0) {
                // Portrait Mobile: pull camera back and center target slightly up in Z
                camera.position.set(4.2, 5.6, 2.8);
                controls.target.set(0, 0, 0.25);
            } else {
                // Landscape / Tablet / Desktop: closer framing
                camera.position.set(3.0, 4.2, 1.9);
                controls.target.set(0, 0, 0.0);
            }
            camera.updateProjectionMatrix();
            controls.update();
        }
        updateResponsiveCamera();

        // =========================================================================
        // SECTION 3: ENVIRONMENT & LIGHTING
        // =========================================================================
        function createStudioEnvMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0c182a');
            grad.addColorStop(0.5, '#040812');
            grad.addColorStop(1, '#010307');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(40, 20, 30, 40);
            ctx.fillRect(180, 40, 40, 30);
            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            return texture;
        }
        scene.environment = createStudioEnvMap();

        scene.add(new THREE.AmbientLight(0xffffff, 0.45));

        const keyLight = new THREE.DirectionalLight(0xfff6e5, 2.4);
        keyLight.position.set(5, 6, 7); scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x90c8ff, 1.5);
        fillLight.position.set(-5, -6, -3); scene.add(fillLight);

        const coreLight = new THREE.PointLight(0x00e5ff, 2.8, 8);
        coreLight.position.set(0, 0, 0); scene.add(coreLight);

        // =========================================================================
        // SECTION 4: MATERIALS & GEOMETRIES
        // =========================================================================
        const crystalBuddhaMat = new THREE.MeshPhysicalMaterial({
            color: 0x80d8ff,
            emissive: 0x002b4d,
            emissiveIntensity: 0.2,
            roughness: 0.16,
            metalness: 0.08,
            transmission: 0.72,
            opacity: 0.88,
            transparent: true,
            depthWrite: false,
            side: THREE.FrontSide
        });

        const sphereGeoA = new THREE.SphereGeometry(0.21, 32, 32);
        const sphereGeoB = new THREE.SphereGeometry(0.15, 32, 32);

        const planeGeoA = new THREE.PlaneGeometry(0.25, 0.25);
        const planeGeoB = new THREE.PlaneGeometry(0.18, 0.18);

        const sphereTransparentMat = new THREE.MeshPhysicalMaterial({
            color: 0xfff8e7,
            roughness: 0.06,
            metalness: 0.15,
            transmission: 0.94,
            ior: 1.52,
            thickness: 0.35,
            transparent: true,
            opacity: 0.85,
            side: THREE.DoubleSide,
            depthWrite: false
        });

        const wallMaterial = new THREE.MeshBasicMaterial({
            color: 0xffe240, transparent: true, opacity: 0.45, side: THREE.DoubleSide,
            depthWrite: false, blending: THREE.AdditiveBlending
        });

        const buddhaGroup = new THREE.Group();
        buddhaGroup.renderOrder = 2;
        scene.add(buddhaGroup);

        const nodesGroup = new THREE.Group();
        nodesGroup.renderOrder = 5;
        scene.add(nodesGroup);

        const axesGroup = new THREE.Group();
        axesGroup.visible = false;
        scene.add(axesGroup);

        const gridMarkersGroup = new THREE.Group();
        gridMarkersGroup.visible = false;
        scene.add(gridMarkersGroup);

        // =========================================================================
        // SECTION 5: BUDDHA 3D MODEL & PROCEDURAL BASELINE
        // =========================================================================
        function buildProceduralBuddha() {
            if (buddhaGroup.children.length > 0) return;
            const fallback = new THREE.Group();
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 32, 32), crystalBuddhaMat);
            head.position.set(0, 0, 0.45); fallback.add(head);

            const usnisa = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), crystalBuddhaMat);
            usnisa.position.set(0, 0, 0.72); fallback.add(usnisa);

        function createAxialLaserBeam(direction, colorHex = 0x00e5ff) {
            const beamGroup = new THREE.Group();
            const totalLength = 2.4, coneHeight = 0.16;
            const cylinderLength = totalLength - coneHeight;
            const cylinderRadius = 0.012, coneRadius = cylinderRadius * 2.2;

            const mat = new THREE.MeshBasicMaterial({
                color: colorHex, transparent: true, opacity: 0.85,
                blending: THREE.AdditiveBlending, side: THREE.DoubleSide
            });

            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(cylinderRadius, cylinderRadius, cylinderLength, 16), mat);
            shaft.position.y = cylinderLength / 2;
            beamGroup.add(shaft);

            const head = new THREE.Mesh(new THREE.ConeGeometry(coneRadius, coneHeight, 16), mat);
            head.position.y = cylinderLength + (coneHeight / 2);
            beamGroup.add(head);

            beamGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            return beamGroup;
        }

        // =========================================================================
        function getSpiralPosition(t) {
            const theta = Math.PI / 2 + t * (Math.PI / 2);
            const r = 1.6 + t * 0.045;
            const z = -0.5 + t * 0.085;
            return new THREE.Vector3(r * Math.cos(theta), r * Math.sin(theta), z);
        }

        const wallGeometry = new THREE.BufferGeometry();
        const wallMesh = new THREE.Mesh(wallGeometry, wallMaterial);
        wallMesh.visible = false;
        nodesGroup.add(wallMesh);

        function rebuildWallGeometry() {
            if (currentSeqIndex < 0 || currentSeqIndex >= currentSequenceNodes.length) return;
            const nodeData = currentSequenceNodes[currentSeqIndex];
            if (!nodeData || !nodeData.id || !nodeData.id.startsWith('A')) {
                wallGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(), 3));
                wallGeometry.setIndex([]);
                return;
            }

            const num = parseInt(nodeData.id.replace(/\D/g, ''));
            const maxT = isNaN(num) ? 0 : Math.max(0, num - 1);
            if (maxT < 1) {
                wallGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(), 3));
                wallGeometry.setIndex([]);
                return;
            }

            const vertices = [], indices = [];
            const segmentsPerNode = 20;
            const totalSegments = Math.round(maxT * segmentsPerNode);
            const wallHeightExtent = 0.22;

            for (let j = 1; j <= totalSegments; j++) {
                const tPrev = (j - 1) / segmentsPerNode;
                const tCurr = j / segmentsPerNode;
                const pPrev = getSpiralPosition(tPrev);
                const pCurr = getSpiralPosition(tCurr);

                const uPrev = new THREE.Vector3(pPrev.x * 1.04, pPrev.y * 1.04, pPrev.z + wallHeightExtent);
                const uCurr = new THREE.Vector3(pCurr.x * 1.04, pCurr.y * 1.04, pCurr.z + wallHeightExtent);
                const lPrev = new THREE.Vector3(pPrev.x * 0.94, pPrev.y * 0.94, pPrev.z - wallHeightExtent);
                const lCurr = new THREE.Vector3(pCurr.x * 0.94, pCurr.y * 0.94, pCurr.z - wallHeightExtent);

                const baseIndex = vertices.length / 3;
                vertices.push(
                    uPrev.x, uPrev.y, uPrev.z,
                    uCurr.x, uCurr.y, uCurr.z,
                    lPrev.x, lPrev.y, lPrev.z,
                    lCurr.x, lCurr.y, lCurr.z
                );
                indices.push(
                    baseIndex + 0, baseIndex + 2, baseIndex + 1,
                    baseIndex + 1, baseIndex + 2, baseIndex + 3
                );
            }

            wallGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertices), 3));
            wallGeometry.setIndex(indices);
            wallGeometry.computeVertexNormals();
            wallGeometry.attributes.position.needsUpdate = true;
            if (wallGeometry.index) wallGeometry.index.needsUpdate = true;
        }

        // =========================================================================
        // SECTION 8: RESILIENT MULTI-TIER IMAGE RESOLVER & PERMANENT TEXTURE CACHE
        // =========================================================================
        function extractGoogleDriveFileId(rawUrl) {
            if (!rawUrl || typeof rawUrl !== 'string') return null;
            rawUrl = rawUrl.trim();
            const match = rawUrl.match(/\/file\/d\/([a-zA-Z0-9_-]{20,})/) ||
                          rawUrl.match(/id=([a-zA-Z0-9_-]{20,})/) ||
                          rawUrl.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
            return match ? match[1] : null;
        }

        function formatImageUrl(rawUrl, id) {
            if (id && id.startsWith('A')) return '06_LA_Gold.PNG';
            if (!rawUrl || typeof rawUrl !== 'string') {
                return canonicalSiddhamFiles[id] || `${id}.png`;
            }
            rawUrl = rawUrl.trim();
            const fileId = extractGoogleDriveFileId(rawUrl);
            if (fileId) {
                return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
            }
            return rawUrl;
        }

        function buildCandidateUrls(rawUrl, id) {
            const list = [];
            const isGroupA = id && id.startsWith('A');

            if (isGroupA) {
                list.push('06_LA_Gold.PNG');
                list.push('06_LA_Gold.png');
                list.push('./06_LA_Gold.PNG');
            }

            if (rawUrl && typeof rawUrl === 'string') {
                const trimmed = rawUrl.trim();
                const fileId = extractGoogleDriveFileId(trimmed);
                if (fileId) {
                    list.push(`https://lh3.googleusercontent.com/d/${fileId}=w1000`);
                    list.push(`https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`);
                    list.push(`https://wsrv.nl/?url=https%3A%2F%2Fdrive.google.com%2Fthumbnail%3Fid%3D${fileId}%26sz%3Dw1000&output=png`);
                } else if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
                    list.push(trimmed);
                    list.push(`https://wsrv.nl/?url=${encodeURIComponent(trimmed)}&output=png`);
                } else {
                    list.push(trimmed);
                    list.push('./' + trimmed);
                }
            }

            if (id && canonicalSiddhamFiles[id]) {
                const canon = canonicalSiddhamFiles[id];
                list.push(canon);
                list.push('./' + canon);
                if (canon.endsWith('.png')) list.push(canon.replace(/\.png$/i, '.PNG'));
                if (canon.endsWith('.PNG')) list.push(canon.replace(/\.PNG$/i, '.png'));
            }

            if (id) {
                list.push(`${id}.png`);
                list.push(`${id}.PNG`);
            }

            return [...new Set(list)];
        }

        const textureCache = new Map();

        async function loadSiddhamTexture(nodeData) {
            const cacheKey = nodeData.id;
            if (textureCache.has(cacheKey)) {
                return textureCache.get(cacheKey);
            }

            const candidates = buildCandidateUrls(nodeData.siddhamImage, nodeData.id);

            for (const candUrl of candidates) {
                const isHttp = candUrl.startsWith('http://') || candUrl.startsWith('https://');
                if (isHttp) {
                    try {
                        const res = await fetch(candUrl, { mode: 'cors' });
                        if (res.ok) {
                            const blob = await res.blob();
                            if (blob && blob.size > 100 && !blob.type.includes('html')) {
                                const objUrl = URL.createObjectURL(blob);
                                const img = new Image();
                                await new Promise((resolve, reject) => {
                                    img.onload = resolve;
                                    img.onerror = reject;
                                    img.src = objUrl;
                                });
                                const tex = new THREE.Texture(img);
                                tex.colorSpace = THREE.SRGBColorSpace;
                                tex.needsUpdate = true;
                                textureCache.set(cacheKey, tex);
                                return tex;
                            }
                        }
                    } catch (e) { /* continue */ }
                }

                try {
                    const img = new Image();
                    if (isHttp) img.crossOrigin = 'anonymous';
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                        img.src = candUrl;
                    });
                    const tex = new THREE.Texture(img);
                    tex.colorSpace = THREE.SRGBColorSpace;
                    tex.needsUpdate = true;
                    textureCache.set(cacheKey, tex);
                    return tex;
                } catch (e) { /* continue */ }
            }

            const fallbackTex = createFallbackGlyphTexture(nodeData.siddhamUnicode, nodeData.id);
            textureCache.set(cacheKey, fallbackTex);
            return fallbackTex;
        }

        function parseCoordinates(coordStr) {
            if (!coordStr) return [0, 0, 0];
            if (Array.isArray(coordStr)) return coordStr.map(Number);
            
            let cleaned = String(coordStr)
                .replace(/[\u2212\u2010\u2011\u2012\u2013\u2014\u2015\uFE63\uFF0D]/g, '-')
                .replace(/[()[\]{}'"]/g, '')
                .trim();

            const matches = cleaned.match(/-?\d+(?:\.\d+)?(?:e[+-]?\d+)?/gi);
            if (matches && matches.length >= 3) {
                return [parseFloat(matches[0]), parseFloat(matches[1]), parseFloat(matches[2])];
            } else if (matches && matches.length === 2) {
                return [parseFloat(matches[0]), parseFloat(matches[1]), 0];
            }
            return [0, 0, 0];
        }

        function naturalCompare(aStr, bStr) {

        // =========================================================================
        // SECTION 10: GOOGLE SHEET DATA LOADING ("A.xx" FILTER HEADERS ONLY)
        // With 3.5s AbortController timeout to prevent any infinite network hang
        // =========================================================================
        async function fetchGoogleSheetData() {
            try {
                syncLabel.innerText = "Connecting Google Sheet...";
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3500);

                const response = await fetch(GVIZ_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                
                const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const gvizData = JSON.parse(jsonStr);
                
                if (gvizData.status !== 'ok') throw new Error("GViz status not ok");
                parseGVizTable(gvizData.table);
                syncLabel.innerText = "Synced with Google Sheet";
                syncDot.style.background = "#00ff88";
            } catch (err) {
                console.warn("Direct Google Sheet JSON fetch fallback to cached matrix.", err);
                useEmbeddedFallbackData();
                syncLabel.innerText = "Cached Matrix Mode";
                syncDot.style.background = "#ffd700";
            } finally {
                hideLoadingOverlay();
            }
        }

        function parseGVizTable(table) {
            let cols = table.cols.map((c, i) => ({ index: i, label: (c.label || c.id || '').trim() }));
            let dataRows = table.rows;

            const firstRowHasHeaders = dataRows.length > 0 && dataRows[0].c && dataRows[0].c.some(cell => {
                if (!cell || cell.v === null) return false;
                const v = String(cell.f !== undefined ? cell.f : cell.v).trim();
                return v.startsWith('A.') || v.toLowerCase().includes('wbs') || v.toLowerCase().includes('lý');
            });

            if (firstRowHasHeaders) {
                const headerRow = dataRows[0];
                cols = cols.map((col, idx) => {
                    const cell = headerRow.c ? headerRow.c[idx] : null;
                    const val = cell && cell.v !== null ? String(cell.f !== undefined ? cell.f : cell.v).trim() : col.label;
                    return { index: idx, label: val || col.label };
                });
                dataRows = dataRows.slice(1);
            }

            const colFind = (keyword) => cols.find(c => c.label.toLowerCase().includes(keyword.toLowerCase()));

            const idCol = cols.find(c => c.label.toLowerCase().startsWith('wbs') || c.label.toLowerCase() === 'id' || c.label.toLowerCase().startsWith('mã')) || cols[0];
            const posCol = colFind('a4 hành') || colFind('spatial position') || colFind('hành');
            
            const coordCol = cols.find(c => {
                const l = c.label.toLowerCase();
                return l.includes('a2 lý') || l.includes('a2 ly') || l.startsWith('a2') || l === 'lý' || l === 'ly';
            }) || colFind('axis') || colFind('coord');

            const siddhamImgCol = colFind('c4 ctt link') || colFind('ctt link') || colFind('image');
            const siddhamUniCol = colFind('c4 siddham unicode') || colFind('siddham unicode') || colFind('siddham');
            const dharmaCol = colFind('c5 dharma object name') || colFind('dharma object') || colFind('pháp bảo');
            const mantraCol = colFind('a4 hành b') || colFind('hành b') || colFind('mantra');

            // STRICTLY INCLUDE ALL COLUMNS STARTING WITH "A." ONLY as requested!
            filterColumns = cols.filter(c => {
                return c.label.startsWith('A.') && c.label.length > 2;
            });

            if (filterColumns.length === 0) {
                filterColumns = [
                    { label: "A.Tổng Thể Bồ Đề Tâm", index: 25 },
                    { label: "A.Cột Trụ Quang Minh", index: 26 },
                    { label: "A.Thường Trụ Bất Biến", index: 27 },
                    { label: "A.Liên Hoa Bồ Đề Tâm", index: 28 },
                    { label: "A.Lục Tý", index: 29 },
                    { label: "A.Ending", index: 30 },
                    { label: "A.A3/3/3", index: 31 },
                    { label: "A.A4/3/3", index: 32 },
                    { label: "A.A5/3/3", index: 33 },
                    { label: "A.A5/5/5", index: 34 }
                ];
            }

            rawSheetRows = [];
            dataRows.forEach(r => {
                if (!r.c) return;
                const getVal = (col) => {
                    if (!col || col.index < 0 || !r.c[col.index]) return '';
                    const cell = r.c[col.index];
                    return (cell.f !== undefined ? cell.f : (cell.v !== undefined ? cell.v : '')).toString().trim();
                };

                const id = getVal(idCol);
                if (!id || id === '-' || id.toLowerCase() === 'id' || id.toLowerCase() === 'wbs') return;

                const sequences = {};
                filterColumns.forEach(fc => {
                    if (fc.index >= 0 && r.c[fc.index]) {
                        const cell = r.c[fc.index];
                        const val = cell.v !== null ? cell.v : cell.f;
                        if (val !== undefined && val !== null) {
                            const strVal = String(val).trim();
                            if (strVal.length > 0 && strVal !== '-' && strVal !== '0') {
                                sequences[fc.label] = strVal;
                            }
                        }
                    }
                });

                const isGroupA = id.startsWith('A');
                const rawCoordsStr = getVal(coordCol);

                rawSheetRows.push({
                    id: id,
                    spatialPosition: getVal(posCol) || (isGroupA ? `Column of Light Node ${id}` : ''),
                    coordsStr: rawCoordsStr,
                    coords: parseCoordinates(rawCoordsStr),
                    siddhamImage: getVal(siddhamImgCol) || (isGroupA ? '06_LA_Gold.PNG' : ''),
                    siddhamUnicode: getVal(siddhamUniCol) || (isGroupA ? '𑖩' : ''),
                    dharmaObject: getVal(dharmaCol) || (isGroupA ? 'Vajra Scepter' : ''),
                    mantra: getVal(mantraCol) || (isGroupA ? 'So La, So La\nOm, Wa Dz La Jr Ning,\nBo La Ni Bo Do Ye,\nSo Po He' : ''),
                    sequences: sequences
                });
            });

            mergeEmbeddedSequencesIfNeeded();
            initMatrixWithParsedData();
        }

        function mergeEmbeddedSequencesIfNeeded() {
            const sample = rawSheetRows.find(r => r.id === 'B01');
            if (!sample || Object.keys(sample.sequences).length === 0) {
                const fallbackMap = getFallbackSequenceMap();
                rawSheetRows.forEach(row => {
                    if (fallbackMap[row.id]) {
                        row.sequences = { ...fallbackMap[row.id], ...row.sequences };
                    }
                });
            }
        }

        function getFallbackSequenceMap() {

        // SECTION 11: INITIALIZATION & INTERLEAVED SPIRAL SEQUENCE ENGINE
        // Rule 3: 4 spiral spheres of LA, then selected matrix, then next 4 LA, etc.
        // =========================================================================
        function initMatrixWithParsedData() {
            if (!active3DActor) {
                active3DActor = buildSingleActiveActorNode();
            }

            filterSelect.innerHTML = '';
            filterColumns.forEach((fc, idx) => {
                const opt = document.createElement('option');
                opt.value = fc.label;
                opt.textContent = fc.label; // Full header starting with "A."
                if (idx === 0) opt.selected = true;
                filterSelect.appendChild(opt);
            });

            const hasSpiralNodes = rawSheetRows.some(r => r.id.startsWith('A'));
            if (!hasSpiralNodes) {
                for (let i = 0; i < 40; i++) {
                    const sp = getSpiralPosition(i);
                    rawSheetRows.push({
                        id: `A${i + 1}`,
                        spatialPosition: `Column of Light Node #${i + 1}`,
                        coords: [sp.x, sp.y, sp.z],
                        coordsStr: `${sp.x.toFixed(2)}, ${sp.y.toFixed(2)}, ${sp.z.toFixed(2)}`,
                        siddhamUnicode: "𑖩",
                        siddhamImage: "06_LA_Gold.PNG",
                        dharmaObject: "Vajra Scepter",
                        mantra: "So La, So La\nOm, Wa Dz La Jr Ning,\nBo La Ni Bo Do Ye,\nSo Po He",
                        sequences: { "A.Cột Trụ Quang Minh": String(i + 1) }
                    });
                }
            } else {
                rawSheetRows.forEach(r => {
                    if (r.id.startsWith('A')) {
                        const num = parseInt(r.id.replace(/\D/g, ''));
                        if (!isNaN(num) && num >= 1 && num <= 40) {
                            if (!r.coords || (r.coords[0] === 0 && r.coords[1] === 0 && r.coords[2] === 0)) {
                                const sp = getSpiralPosition(num - 1);
                                r.coords = [sp.x, sp.y, sp.z];
                                r.coordsStr = `${sp.x.toFixed(2)}, ${sp.y.toFixed(2)}, ${sp.z.toFixed(2)}`;
                            }
                            if (!r.siddhamImage) r.siddhamImage = '06_LA_Gold.PNG';
                        }
                    }
                });
            }

            resetAnimation();
            generateActiveSequence();
        }

            const selectedFilter = filterSelect.value || (filterColumns[0] ? filterColumns[0].label : '');
            const includeSpiral = includeSpiralCheckbox.checked;

            const matchingRows = rawSheetRows.filter(r => {
                return r.sequences && r.sequences[selectedFilter] !== undefined && String(r.sequences[selectedFilter]).trim().length > 0;
            });

            matchingRows.sort((a, b) => {
                return naturalCompare(a.sequences[selectedFilter], b.sequences[selectedFilter]);
            });

            const spiralNodes = rawSheetRows.filter(r => r.id.startsWith('A')).sort((a, b) => {
                const nA = parseInt(a.id.replace(/\D/g, '')) || 0;
                const nB = parseInt(b.id.replace(/\D/g, '')) || 0;
                return nA - nB;
            });

            currentSequenceNodes = [];

            if (selectedFilter.includes("Cột Trụ Quang Minh")) {
                currentSequenceNodes = [...spiralNodes];
            } else if (includeSpiral) {
                // Rule 3: Interleaved 4 LA spheres, then selected sequence matrix, then next 4 LA, etc.
                const nonSpiral = matchingRows.filter(r => !r.id.startsWith('A'));
                for (let k = 0; k < 10; k++) {
                    for (let s = 0; s < 4; s++) {
                        const sNode = spiralNodes[k * 4 + s];
                        if (sNode) currentSequenceNodes.push(sNode);
                    }
                    nonSpiral.forEach(node => currentSequenceNodes.push(node));
                }
            } else {
                currentSequenceNodes = matchingRows.filter(r => !r.id.startsWith('A'));
            }

            uiTitle.innerText = selectedFilter || "Sequence Matrix";
        }

        function resetAnimation() {
            isRunning = false;
            currentSeqIndex = -1;
            seqTimer = 0;

            if (active3DActor) {
                active3DActor.group.visible = false;
                active3DActor.outline.visible = false;
                active3DActor.glow = 0.0;
                active3DActor.currentData = null;
            }

            wallMesh.visible = false;
            rebuildWallGeometry();
            hidePopup();
            startBtn.innerText = "Start Formation";
        }

        async function triggerNextStep() {
            if (currentSeqIndex < currentSequenceNodes.length - 1) {
                if (active3DActor) {
                    active3DActor.group.visible = false;
                    active3DActor.outline.visible = false;
                    active3DActor.glow = 0.0;
                }

                currentSeqIndex++;
                const nodeData = currentSequenceNodes[currentSeqIndex];

                const rawCoords = nodeData.coordsStr ? parseCoordinates(nodeData.coordsStr) : nodeData.coords;
                nodeData.coords = rawCoords;

                if (active3DActor) {
                    const isGroupA = nodeData.id && nodeData.id.startsWith('A');

                    active3DActor.group.position.set(rawCoords[0], rawCoords[1], rawCoords[2]);

                    active3DActor.sphere.geometry = isGroupA ? sphereGeoA : sphereGeoB;
                    active3DActor.plane.geometry = isGroupA ? planeGeoA : planeGeoB;

                    active3DActor.currentData = nodeData;

                    // Load Siddham texture (cached after first fetch)
                    const tex = await loadSiddhamTexture(nodeData);
                    if (active3DActor.currentData && active3DActor.currentData.id === nodeData.id) {
                        active3DActor.planeMat.map = tex;
                        active3DActor.planeMat.needsUpdate = true;
                    }

                    active3DActor.glow = 2.0;
                    active3DActor.group.visible = true;
                }

                if (includeSpiralCheckbox.checked) {
                    rebuildWallGeometry();
                }

                // Rule 5: Keep Siddham Node Details active and updated with live node data
                showPopup(nodeData);
            } else {
                if (!includeSpiralCheckbox.checked) {
                    currentSeqIndex = -1;
                    triggerNextStep();
                } else {
                    isRunning = false;
                    startBtn.innerText = "Restart Formation";
                }
            }
        }

        function showPopup(data) {
            if (!data) return;
            const isGroupA = data.id && data.id.startsWith('A');
            const selectedFilter = filterSelect.value;
            popupId.innerText = data.id || "-";
            popupPosition.innerText = data.spatialPosition || "Central Axis";
            
            popupCoords.innerText = `X: ${data.coords[0].toFixed(2)}, Y: ${data.coords[1].toFixed(2)}, Z: ${data.coords[2].toFixed(2)}`;
            
            const stepVal = data.sequences && data.sequences[selectedFilter] !== undefined ? `#${data.sequences[selectedFilter]}` : '-';
            popupSeqStep.innerText = `${stepVal} (${selectedFilter})`;

            popupSiddham.innerText = `${data.siddhamUnicode || ""} (${data.id})`;
            popupDharma.innerText = data.dharmaObject || "-";
            popupMantra.textContent = data.mantra || "Sacred Seed Sound";

            const sUrl = formatImageUrl(data.siddhamImage, data.id);
            if (sUrl) {
                popupSiddhamImg.src = sUrl;
                popupSiddhamImg.onerror = () => {
                    const fid = extractGoogleDriveFileId(data.siddhamImage);
                    if (fid) {
                        popupSiddhamImg.src = `https://lh3.googleusercontent.com/d/${fid}`;
                    } else if (isGroupA) {
                        popupSiddhamImg.src = '06_LA_Gold.PNG';
                    } else if (canonicalSiddhamFiles[data.id]) {
                        popupSiddhamImg.src = canonicalSiddhamFiles[data.id];
                    }
                };
                boxSiddhamImg.style.display = 'block';
            } else {
                boxSiddhamImg.style.display = 'none';
            }

            popupCard.classList.add('active');
        }

        function hidePopup() {
            popupCard.classList.remove('active');
            if (active3DActor) active3DActor.outline.visible = false;
        }

        document.getElementById('popup-close').addEventListener('click', (e) => {
            e.stopPropagation();
            hidePopup();
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handlePointerDown(event) {
            if (event.target.closest('#ui-container') || event.target.closest('#popup-card') || event.target.closest('#top-bar')) return;
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (active3DActor && active3DActor.group.visible) {
                const intersects = raycaster.intersectObjects([active3DActor.sphere, active3DActor.plane]);
                if (intersects.length > 0) {
                    showPopup(active3DActor.currentData);
                    active3DActor.outline.visible = true;
                    return;
                }
            }
        }
        window.addEventListener('pointerdown', handlePointerDown);

        // =========================================================================
        // SECTION 13: UI EVENT LISTENERS
        // =========================================================================
        startBtn.addEventListener('click', () => {
            if (isRunning) {
                resetAnimation();
            } else {
                resetAnimation();
                generateActiveSequence();
                isRunning = true;
                wallMesh.visible = includeSpiralCheckbox.checked;
                startBtn.innerText = "Reset / Restart";

                // Rule 5: Collapse filter box so it only shows the selected sequence matrix
                uiContainer.classList.add('collapsed');
                uiToggleBtn.innerText = '▼';
                uiTitle.innerText = filterSelect.value || "Sequence Matrix";

                triggerNextStep();
            }
        });

        filterSelect.addEventListener('change', () => {
            uiTitle.innerText = filterSelect.value;
            resetAnimation();
            generateActiveSequence();
        });

        includeSpiralCheckbox.addEventListener('change', () => {
            wallMesh.visible = includeSpiralCheckbox.checked && isRunning;
            resetAnimation();
            generateActiveSequence();
        });

        showAxesCheckbox.addEventListener('change', (e) => {
            axesGroup.visible = e.target.checked;
        });

        showGridMarkersCheckbox.addEventListener('change', (e) => {
            gridMarkersGroup.visible = e.target.checked;
        });

        uiHeader.addEventListener('click', () => {
            const isCollapsed = uiContainer.classList.toggle('collapsed');
            uiToggleBtn.innerText = isCollapsed ? '▼' : '▲';
            if (isCollapsed) {
                uiTitle.innerText = filterSelect.value || "Sequence Matrix";
            } else {
                uiTitle.innerText = "Sequence Matrix";
            }
        });

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateResponsiveCamera();
        });

        // =========================================================================
        // SECTION 14: ANIMATION LOOP
        // =========================================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            const glowVal = parseFloat(glowIntensityInput.value);
            coreLight.intensity = (Math.sin(elapsedTime * 2) * 0.4 + 1.2) * glowVal;
            coreLight.position.z = Math.sin(elapsedTime * 0.6) * 0.4;

            if (isRunning) {
                seqTimer += delta;
                if (seqTimer >= nodeInterval) {
                    seqTimer = 0;
                    triggerNextStep();
                }
                if (includeSpiralCheckbox.checked) {
                    wallMaterial.opacity = (0.35 + Math.sin(elapsedTime * 3.0) * 0.1) * glowVal;
                }
            }

            const rpm = parseFloat(rotationSpeedInput.value);
            const rotationStep = ((rpm * Math.PI * 2) / 60) * delta;
            nodesGroup.rotation.z += rotationStep;
            buddhaGroup.rotation.z += rotationStep;

            if (active3DActor && active3DActor.group.visible) {
                active3DActor.glow = THREE.MathUtils.lerp(active3DActor.glow, 1.0, 0.05);

                const pulseScale = 1.0 + (Math.sin(elapsedTime * 3.0) * 0.04);
                active3DActor.sphere.scale.setScalar(pulseScale);

                if (billboardModeSelect.value === 'billboard') {
                    active3DActor.spinPivot.rotation.set(0, 0, 0);
                    active3DActor.plane.quaternion.copy(camera.quaternion);
                    active3DActor.outline.quaternion.copy(camera.quaternion);
                } else {
                    active3DActor.plane.rotation.set(Math.PI / 2, 0, 0);
                    active3DActor.outline.rotation.set(Math.PI / 2, 0, 0);
                    active3DActor.spinPivot.rotation.set(0, 0, elapsedTime * 1.6);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        fetchGoogleSheetData();
        animate();
    </script>
</body>
</html>
