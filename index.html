<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lotus Bodhicitta System</title>
    <style>
        :root {
            --bg-dark: #020409;
            --panel-bg: rgba(6, 12, 24, 0.90);
            --panel-border: rgba(255, 215, 0, 0.28);
            --accent-gold: #ffd700;
            --accent-gold-bright: #fff07a;
            --accent-cyan: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #8fa0b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #081122 0%, #03060d 60%, #010206 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main); user-select: none; -webkit-user-select: none;
        }

        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Floating Top Control Bar */
        #top-bar {
            position: absolute; top: env(safe-area-inset-top, 16px); left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 30;
        }

        #start-btn {
            pointer-events: auto;
            background: linear-gradient(135deg, #ffd700 0%, #ff9900 100%);
            color: #03060d; border: 1px solid rgba(255, 240, 120, 0.85);
            padding: 11px 22px; border-radius: 12px; font-weight: 800; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1.4px; font-size: 11px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.45), inset 0 1px 1px rgba(255,255,255,0.6);
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
        }
        #start-btn:hover {
            background: linear-gradient(135deg, #fff07a 0%, #ffaa00 100%);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.7);
            transform: translateY(-2px);
        }
        #start-btn:active { transform: translateY(1px); }

        #sync-status {
            pointer-events: auto;
            display: flex; align-items: center; gap: 8px;
            background: rgba(4, 9, 18, 0.85); border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 7px 14px; border-radius: 20px; font-size: 11px; color: var(--text-muted);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        #sync-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }

        /* Collapsible Filter Panel (LHS Span) */
        #ui-container {
            position: absolute; top: calc(env(safe-area-inset-top, 16px) + 54px); left: 16px;
            background: var(--panel-bg); padding: 14px 18px; border-radius: 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75); border: 1px solid var(--panel-border);
            width: 310px; pointer-events: auto;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1); z-index: 25;
            max-height: calc(100vh - (env(safe-area-inset-top, 16px) + 70px) - env(safe-area-inset-bottom, 16px));
            display: flex; flex-direction: column; box-sizing: border-box;
        }
        #ui-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; flex-shrink: 0; }
        h1 { font-size: 13px; margin: 0; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 800; }
        #ui-toggle-btn { background: none; border: none; color: var(--accent-gold); font-size: 12px; cursor: pointer; padding: 4px; transition: transform 0.3s ease; }
        #ui-content {
            margin-top: 12px;
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            padding-right: 4px;
            transition: opacity 0.3s ease;
            opacity: 1;
        }

        /* Custom Scrollbar for Smooth & Visible Scrolling */
        #ui-content::-webkit-scrollbar { width: 5px; }
        #ui-content::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.25); border-radius: 4px; }
        #ui-content::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.4); border-radius: 4px; }
        #ui-content::-webkit-scrollbar-thumb:hover { background: rgba(255, 215, 0, 0.75); }

        /* Collapsed Filter Box: ONLY displays selected sequence matrix name */
        #ui-container.collapsed { width: auto; max-width: 280px; padding: 10px 14px; max-height: 48px; }
        #ui-container.collapsed #ui-header h1 { font-size: 11px; color: var(--accent-gold-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #ui-container.collapsed #ui-toggle-btn { transform: rotate(-90deg); margin-left: 10px; }
        #ui-container.collapsed #ui-content { max-height: 0; opacity: 0; margin-top: 0; pointer-events: none; overflow: hidden; }

        .control-group { margin-bottom: 11px; }
        label { display: block; font-size: 10px; color: #8fa0b8; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; }
        select, input[type="range"] {
            width: 100%; background: #0c1524; border: 1px solid #1c2b42; color: #fff;
            padding: 8px 10px; border-radius: 7px; outline: none; box-sizing: border-box; font-size: 11px;
            transition: border-color 0.2s;
        }
        select:focus { border-color: var(--accent-gold); }

        .checkbox-container { display: flex; align-items: center; gap: 8px; margin-top: 6px; cursor: pointer; }
        .checkbox-container input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--accent-gold); cursor: pointer; }
        .checkbox-container span { font-size: 11px; color: #e2e8f0; letter-spacing: 0.3px; }

        details { background: rgba(12, 21, 36, 0.5); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 7px 10px; margin-top: 8px; }
        summary { font-size: 10px; color: var(--accent-gold); cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; outline: none; }

        /* Siddham Node Details Card (Non-blocking, right on Desktop, bottom on Mobile) */
        #popup-card {
            position: absolute;
            background: rgba(6, 12, 24, 0.94); border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 16px; padding: 16px 20px;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85), 0 0 25px rgba(255, 215, 0, 0.12);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.3s ease;
            opacity: 0; pointer-events: none; z-index: 28; max-height: 80vh; overflow-y: auto;
        }
        #popup-card.active { opacity: 1; pointer-events: auto; }
        #popup-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: #8fa0b8; font-size: 18px; cursor: pointer; padding: 4px; line-height: 1; }
        #popup-close:hover { color: #fff; }
        #popup-title {
            color: var(--accent-gold); margin: 0 0 10px 0; font-size: 13px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2); padding-bottom: 6px;
        }
        .popup-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 11px; }
        .popup-label { color: #8fa0b8; font-weight: 600; }
        .popup-val { font-weight: 700; color: #fff; text-align: right; max-width: 65%; }

        .popup-images { display: flex; gap: 10px; margin: 10px 0; }
        .popup-img-box {
            flex: 1; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,215,0,0.22);
            border-radius: 8px; padding: 6px; text-align: center;
        }
        .popup-img-box span { font-size: 9px; color: var(--accent-gold); display: block; margin-bottom: 4px; text-transform: uppercase; font-weight: 600; }
        .popup-img-box img { max-width: 100%; height: 75px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255,215,0,0.45)); }

        .popup-mantra-section { margin-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 8px; }
        .popup-mantra-val {
            font-family: Georgia, Cambria, 'Times New Roman', serif; font-style: italic;
            font-size: 11.5px; line-height: 1.5; color: var(--accent-gold-bright);
            background: rgba(255, 215, 0, 0.05); border-left: 2px solid var(--accent-gold);
            padding: 8px 12px; border-radius: 0 8px 8px 0; white-space: pre-line;
        }

        .nav-control-group {
            display: flex; align-items: center; gap: 8px; pointer-events: auto; flex-wrap: wrap;
        }

        #playback-controls {
            display: flex; align-items: center; gap: 4px;
            background: rgba(6, 12, 24, 0.85); border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 12px; padding: 4px 8px; backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #playback-controls button {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--accent-gold); border-radius: 6px; padding: 6px 10px; font-size: 11px;
            cursor: pointer; transition: all 0.2s ease; line-height: 1;
        }
        #playback-controls button:hover {
            background: rgba(255, 215, 0, 0.25); border-color: var(--accent-gold);
            color: #fff; transform: translateY(-1px);
        }
        #playback-controls button:active { transform: translateY(1px); }

        #anim-speed-select {
            width: auto; background: #0c1524; border: 1px solid rgba(255, 215, 0, 0.3);
            color: var(--accent-gold); border-radius: 6px; padding: 5px 8px; font-size: 10px;
            font-weight: 700; outline: none; cursor: pointer;
        }

        /* 1. Desktop & Tablet Landscape (min-width: 768px, height >= 500px):
           - LHS UI Filter Panel: open / expanded by default
           - RHS Detail View Card: open / expanded alongside the Buddha
           - Centered Buddha framed so entire system fits comfortably between drawers */
        @media (min-width: 768px) and (min-height: 500px) and (orientation: landscape), (min-width: 900px) and (min-aspect-ratio: 1/1) {
            #ui-container {
                top: calc(env(safe-area-inset-top, 16px) + 54px);
                left: 20px; width: 310px; z-index: 25;
                max-height: calc(100vh - (env(safe-area-inset-top, 16px) + 70px) - env(safe-area-inset-bottom, 20px));
            }
            #popup-card {
                top: calc(env(safe-area-inset-top, 16px) + 54px);
                right: 20px; width: 340px;
                max-height: calc(100vh - (env(safe-area-inset-top, 16px) + 70px) - env(safe-area-inset-bottom, 20px));
                transform: translateX(30px); z-index: 28;
            }
            #popup-card.active { transform: translateX(0); }
        }

        /* 2. Mobile Landscape Mode (max-height < 500px, or width < 900px in landscape):
           - No LHS or RHS drawers displayed by default; pure 3D view of the entire system
           - Filter panel collapses to small header
           - Popup card appears as compact floating overlay only on user selection */
        @media (max-height: 499px) and (orientation: landscape), (max-width: 899px) and (orientation: landscape) and (max-height: 600px) {
            #top-bar { top: env(safe-area-inset-top, 6px); left: 10px; right: 10px; }
            .nav-control-group { gap: 6px; }
            #start-btn { padding: 7px 12px; font-size: 9.5px; }
            #playback-controls { padding: 2px 6px; gap: 3px; }
            #playback-controls button { padding: 4px 7px; font-size: 9.5px; }
            #anim-speed-select { padding: 3px 5px; font-size: 9px; }
            #sync-status { padding: 4px 8px; font-size: 9.5px; }

            #ui-container {
                top: calc(env(safe-area-inset-top, 6px) + 42px); left: 10px;
                width: 260px; max-height: calc(100vh - 54px); padding: 8px 12px; z-index: 25;
            }
            #ui-container.collapsed { width: auto; max-width: 220px; padding: 6px 10px; }
            #ui-content { max-height: calc(100vh - 100px); overflow-y: auto; }

            #popup-card {
                top: calc(env(safe-area-inset-top, 6px) + 42px); right: 10px;
                width: 280px; max-height: calc(100vh - 54px);
                transform: translateX(20px); padding: 10px 14px; z-index: 35;
            }
            #popup-card.active { transform: translateX(0); }
            .popup-img-box img { height: 45px; }
            .popup-row { margin-bottom: 3px; font-size: 9.5px; }
            .popup-mantra-val { font-size: 9.5px; padding: 4px 8px; }
        }

        /* 3. Mobile Portrait View (max-aspect-ratio: 1/1, phone held vertically):
           - Filter selection collapses cleanly after selection or on start
           - No drawers displayed by default; pure 3D view of the entire system
           - When Siddham sphere is tapped, pauses sequence and opens bottom drawer popup
           - When popup is closed, resumes sequence */
        @media (max-width: 767px) and (orientation: portrait), (max-aspect-ratio: 1/1) {
            #top-bar { top: env(safe-area-inset-top, 10px); left: 10px; right: 10px; }
            .nav-control-group { gap: 6px; }
            #start-btn { padding: 9px 14px; font-size: 10px; letter-spacing: 0.8px; }
            #playback-controls { padding: 3px 6px; gap: 3px; }
            #playback-controls button { padding: 5px 8px; font-size: 10px; }
            #anim-speed-select { padding: 4px 6px; font-size: 9px; }
            #sync-status { padding: 5px 10px; font-size: 10px; }

            #ui-container {
                top: calc(env(safe-area-inset-top, 10px) + 50px); left: 10px;
                width: calc(100vw - 20px); max-width: none;
                max-height: calc(100vh - (env(safe-area-inset-top, 10px) + 60px) - env(safe-area-inset-bottom, 16px));
            }
            #ui-container.collapsed { max-width: calc(100vw - 20px); width: calc(100vw - 20px); padding: 8px 12px; }

            #popup-card {
                bottom: env(safe-area-inset-bottom, 10px); left: 10px; right: 10px;
                width: auto; max-width: none; max-height: 44vh;
                transform: translateY(30px);
                padding: 14px 16px; z-index: 35;
            }
            #popup-card.active { transform: translateY(0); }
            .popup-img-box img { height: 55px; }
            .popup-row { margin-bottom: 4px; font-size: 10.5px; }
            .popup-mantra-val { font-size: 10.5px; padding: 6px 10px; }
        }

        #animate-ego-btn, #animate-laser-btn, #animate-spiral-beams-btn, #animate-torus-in-btn, #animate-torus-out-btn, #animate-lotus-seq-btn, #animate-hien-luan-btn, #animate-ego-seq-btn {
            margin-top: 5px; width: 100%;
            background: rgba(0, 229, 255, 0.12); border: 1px solid rgba(0, 229, 255, 0.45);
            color: var(--accent-cyan); padding: 6px 10px; border-radius: 8px;
            font-size: 9.5px; font-weight: 700; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.8px;
            transition: all 0.2s ease;
        }
        #animate-ego-btn:hover, #animate-laser-btn:hover, #animate-spiral-beams-btn:hover, #animate-torus-in-btn:hover, #animate-torus-out-btn:hover, #animate-lotus-seq-btn:hover, #animate-hien-luan-btn:hover, #animate-ego-seq-btn:hover {
            background: rgba(0, 229, 255, 0.25);
            box-shadow: 0 0 14px rgba(0, 229, 255, 0.45);
        }
        #animate-laser-btn {
            background: rgba(255, 215, 0, 0.12);
            border-color: rgba(255, 215, 0, 0.45);
            color: var(--accent-gold);
        }
        #animate-laser-btn:hover {
            background: rgba(255, 215, 0, 0.25);
            box-shadow: 0 0 14px rgba(255, 215, 0, 0.45);
        }
        #animate-spiral-beams-btn {
            background: rgba(187, 102, 255, 0.12);
            border-color: rgba(187, 102, 255, 0.45);
            color: #bb66ff;
        }
        #animate-spiral-beams-btn:hover {
            background: rgba(187, 102, 255, 0.25);
            box-shadow: 0 0 14px rgba(187, 102, 255, 0.45);
        }
        #animate-torus-in-btn {
            background: rgba(0, 255, 170, 0.12);
            border-color: rgba(0, 255, 170, 0.45);
            color: #00ffaa;
        }
        #animate-torus-in-btn:hover {
            background: rgba(0, 255, 170, 0.25);
            box-shadow: 0 0 14px rgba(0, 255, 170, 0.45);
        }
        #animate-torus-out-btn {
            background: rgba(255, 136, 0, 0.12);
            border-color: rgba(255, 136, 0, 0.45);
            color: #ff9900;
        }
        #animate-torus-out-btn:hover {
            background: rgba(255, 136, 0, 0.25);
            box-shadow: 0 0 14px rgba(255, 136, 0, 0.45);
        }

        /* Loading Screen */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #020409; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; transition: opacity 0.4s ease;
        }
        .spinner {
            width: 44px; height: 44px; border: 2px solid rgba(255, 215, 0, 0.15);
            border-top-color: var(--accent-gold); border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { margin-top: 16px; color: var(--accent-gold); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; }
    </style>

    <!-- Three.js + Controls + Loaders -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Lotus Bodhicitta Matrix</div>
    </div>

    <div id="top-bar">
        <div class="nav-control-group">
            <button id="start-btn">Start Formation</button>
            <div id="playback-controls">
                <button id="btn-step-prev" title="Step Reverse (Back 1 Node)">&#9664;&#9612;</button>
                <button id="btn-play-pause" title="Pause / Stop Animation">&#10074;&#10074;</button>
                <button id="btn-step-next" title="Step Forward (Next Node)">&#9612;&#9654;</button>
                <select id="anim-speed-select" title="Animation Speed">
                    <option value="0.5">0.5x Slow</option>
                    <option value="1.0" selected>1.0x Normal</option>
                    <option value="1.5">1.5x Fast</option>
                    <option value="2.0">2.0x Rapid</option>
                </select>
            </div>
        </div>
        <div id="sync-status">
            <span id="sync-dot"></span>
            <span id="sync-label">Matrix Ready</span>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- Collapsible UI Filter Panel -->
    <div id="ui-container">
        <div id="ui-header">
            <h1 id="ui-title">Sequence Matrix</h1>
            <button id="ui-toggle-btn">▲</button>
        </div>
        <div id="ui-content">
            <div class="control-group">
                <label>Filter Sequence Matrix ("A.xx" Only)</label>
                <select id="filter-select">
                    <option value="" disabled selected>Loading sequences...</option>
                </select>
            </div>

            <div class="control-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="include-spiral" checked>
                    <span>Include Column of Light Spiral</span>
                </label>
            </div>

            <div class="control-group">
                <label>Auto-Rotation Speed (RPM)</label>
                <input type="range" id="rotation-speed" min="0" max="10" step="0.1" value="0">
            </div>

            <div class="control-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="show-ego-bubble">
                    <span>Bubble of Ego (Outer Bubble)</span>
                </label>
                <button type="button" id="animate-ego-btn">
                    ▶ Animate Bubble of Ego
                </button>
            </div>

            <div class="control-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="show-laser-beams">
                    <span>Laser Beam of Lights (6 Axes)</span>
                </label>
                <button type="button" id="animate-laser-btn">
                    ▶ Animate Laser Beams of Light
                </button>
            </div>

            <div class="control-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="show-spiral-beams">
                    <span>Spiral Beams (6 Cardinal Helixes)</span>
                </label>
                <button type="button" id="animate-spiral-beams-btn">
                    ▶ Animate Spiral Beams
                </button>
            </div>

            <div class="control-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="show-torus-in">
                    <span>Torus In (Crown -> Core -> Seat)</span>
                </label>
                <button type="button" id="animate-torus-in-btn">
                    ▶ Animate Torus In
                </button>
            </div>

            <div class="control-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="show-torus-out">
                    <span>Torus Out (Crown -> Beyond Bubble)</span>
                </label>
                <button type="button" id="animate-torus-out-btn">
                    ▶ Animate Torus Out
                </button>
            </div>

            <div class="control-group">
                <label style="display:block; font-size: 9.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; margin-bottom: 4px;">Liên Hoa Bồ Đề Tâm (4-Petal Lotus)</label>
                <button type="button" id="animate-lotus-seq-btn">
                    ▶ Animate Lotus Sequence
                </button>
            </div>

            <div class="control-group">
                <label style="display:block; font-size: 9.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; margin-bottom: 4px;">Hiện Luân (Transforming Light Vortex)</label>
                <button type="button" id="animate-hien-luan-btn">
                    ▶ Animate Hien Luan
                </button>
            </div>

            <div class="control-group">
                <label style="display:block; font-size: 9.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; margin-bottom: 4px;">Lục Đại Nhật Nguyệt (Ego Sequence)</label>
                <button type="button" id="animate-ego-seq-btn">
                    ▶ Animate Ego Sequence
                </button>
            </div>

            <div class="control-group">
                <label class="checkbox-container">
                    <!-- Default UNCHECKED as requested -->
                    <input type="checkbox" id="show-axes">
                    <span>Show Coordination Axes</span>
                </label>
            </div>

            <div class="control-group">
                <label class="checkbox-container">
                    <!-- Default UNCHECKED as requested -->
                    <input type="checkbox" id="show-grid-markers">
                    <span>Show 0.5 Unit Markers</span>

        // 1. The top pole (+Y in Three.js) maps to Crown (+Z in Buddha coordinates).

        // 3. The sweep angle phi wraps around the VERTICAL Z-AXIS in the horizontal XY plane,
        //    starting at Front (+Y, facing camera) and wrapping counterclockwise around the Buddha!
        function createOuterBubbleGeometry(phiLength = Math.PI * 2, widthSegs = 64, heightSegs = 64) {
            const geo = new THREE.SphereGeometry(2.1, widthSegs, heightSegs, 0, phiLength);
            geo.rotateX(Math.PI / 2);
            geo.rotateZ(-Math.PI / 2);
            return geo;

        // True Circular Horn Torus evaluation in (R, Z) plane:
        // Circle equation: (R - R_0)^2 + (Z - Z_c)^2 = r_circ^2
        // Both Crown (Z=1.0) and Seat (Z=-0.5) are symmetric around Z_c = 0.25, with H = 0.75.
        // This guarantees an exact 1:1 circular aspect ratio, 100% symmetric top-to-bottom, no lopsided distortion!
        function evaluateHornTorusPoint(tau, azimuth, direction) {
            const Z_c = 0.25;
            const H = 0.75;
            const R_core = 0.04;
            let r, z;

            if (direction === 'in') {
                // Torus In:
                // Strictly INSIDE the Bubble of Ego (radius 2.10).
                // Max horizontal radius R_max = 1.65.
                // Circle radius r_circ = 0.995, R_0 = 0.655.
                // Distance to origin <= 1.69 everywhere, comfortably within 2.10!
                const R_max = 1.65;
                const R_0 = (R_max * R_max - H * H) / (2.0 * R_max); // 0.655
                const r_circ = R_max - R_0;                          // 0.995
                const alpha_top = Math.PI - Math.asin(H / r_circ);   // 131.1 deg

                if (tau < 0.35) {
                    // Core descent: enters Crown (1.0), flows down through Buddha's body core to Seat (-0.5)
                    const s = tau / 0.35;
                    z = 1.0 - s * 1.5;
                    r = R_core;
                } else {
                    // Outer circular arc: leaves Seat (-0.5) at trumpet angle, curves outward around equator (Z=0.25, R=1.65),
                    // crests smoothly at Z=1.245, and funnels back down into Crown (1.0).
                    const s = (tau - 0.35) / 0.65;
                    const alpha = -alpha_top + s * (2.0 * alpha_top);
                    r = Math.max(R_core, R_0 + r_circ * Math.cos(alpha));
                    z = Z_c + r_circ * Math.sin(alpha);
                }
            } else {
                // Torus Out:
                // Circular energy ring extending HIGHER and BEYOND the Bubble of Ego!
                // Circle radius r_circ = 2.05, max_Z = 2.30 (> 2.10), R_max = 3.96 (> 2.10).
                const r_circ = 2.05;
                const R_0 = Math.sqrt(r_circ * r_circ - H * H);     // 1.908
                const alpha_top = Math.PI - Math.asin(H / r_circ);   // 158.5 deg

                if (tau < 0.35) {
                    // Core ascent: rises from Seat (-0.5) up through core to Crown (1.0)
                    const s = tau / 0.35;
                    z = -0.5 + s * 1.5;
                    r = R_core;
                } else {
                    // Outer circular arc: erupts upward from Crown, crests at Z=2.30 (> 2.1),
                    // sweeps wide beyond bubble to R=3.96 (> 2.1), and funnels into Seat (-0.5).
                    const s = (tau - 0.35) / 0.65;
                    const alpha = alpha_top - s * (2.0 * alpha_top);
                    r = Math.max(R_core, R_0 + r_circ * Math.cos(alpha));
                    z = Z_c + r_circ * Math.sin(alpha);
                }
            }

            return {
                x: r * Math.cos(azimuth),
                y: r * Math.sin(azimuth),
                z: z
            };
        }

        function buildHornTorusSystem(colorHex, colorHexStr, direction) {

        // =========================================================================

        axesDirections.forEach(axis => {

        function updateSpiralBeams(progress, spinOffset = 0) {
            const currentL = progress * spiralLength;
            const activePts = Math.max(2, Math.round(progress * spiralPtsPerBeam));

            spiralBeamItems.forEach(item => {
                let ptr = 0;
                let lastX = 0, lastY = 0, lastZ = 0;

                for (let j = 0; j < spiralPtsPerBeam; j++) {
                    const s = (j / (spiralPtsPerBeam - 1)) * currentL;
                    // Starts strictly at 0, 0, 0 (radius = 0), then widens and expands outward along the axis (Image 3)
                    const r = maxSpiralRadius * Math.pow(s / spiralLength, 0.85);
                    const theta = (s / spiralLength) * Math.PI * 2 * spiralTurns + spinOffset;

                    const x = s * item.d.x + r * (Math.cos(theta) * item.v1.x + Math.sin(theta) * item.v2.x);
                    const y = s * item.d.y + r * (Math.cos(theta) * item.v1.y + Math.sin(theta) * item.v2.y);
                    const z = s * item.d.z + r * (Math.cos(theta) * item.v1.z + Math.sin(theta) * item.v2.z);

                    item.positions[ptr++] = x;
                    item.positions[ptr++] = y;
                    item.positions[ptr++] = z;

                    if (j === activePts - 1) {

                mantra: "Six Expanding Conical Helices / Khởi Từ Tâm Điểm (0,0,0), Phóng Lục Đạo Xoắn Ốc Mở Rộng Xuyên Suốt Không Gian",
                sequences: { [filterSelect.value || "A.Tổng Thể Bồ Đề Tâm"]: "SPIRAL" }

        // =========================================================================
        function getSpiralPosition(t) {
            // Counterclockwise rotation: Starts on +Y axis (PI/2), 4 spheres = 2*PI (one full turn)
            const theta = Math.PI / 2 + t * (Math.PI / 2);
            // Exactly 0.25 unit height per layer of 4 spheres => 0.0625 per sphere
            const z = -0.50 + t * 0.0625;
            // Smoothly expanding linear cone: R = 1.35 at Z = -0.50, up to R = 2.20 at Z = 2.00
            const r = 1.35 + (z + 0.50) * 0.34;
            return new THREE.Vector3(r * Math.cos(theta), r * Math.sin(theta), z);
        }

        const wallGeometry = new THREE.BufferGeometry();
        const wallMesh = new THREE.Mesh(wallGeometry, wallMaterial);
        wallMesh.visible = false;
        nodesGroup.add(wallMesh);

        function rebuildWallGeometry() {
            const activeLANodes = currentSequenceNodes.slice(0, currentSeqIndex + 1).filter(n => n.id && n.id.startsWith('A'));
            if (activeLANodes.length < 2) {
                wallGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(), 3));
                wallGeometry.setIndex([]);
                return;
            }
            const maxT = Math.max(...activeLANodes.map(n => {
                const num = parseInt(n.id.replace(/\D/g, ''));
                return isNaN(num) ? 0 : num - 1;
            }));

            const vertices = [], indices = [];
            const segmentsPerNode = 20;
            const totalSegments = Math.round(maxT * segmentsPerNode);

            for (let j = 1; j <= totalSegments; j++) {
                const tPrev = (j - 1) / segmentsPerNode;
                const tCurr = j / segmentsPerNode;
                const pPrev = getSpiralPosition(tPrev);
                const pCurr = getSpiralPosition(tCurr);

                // Bottom boundary: connect seamlessly to the turn directly below (t - 4),
                // or clamp to the base circular plane (Z = -0.50, R = 1.35) for the first turn (t < 4).
                // This naturally tapers from height 0 at t = 0 to full 0.25 height at t = 4 with zero blunt ends!
                let bPrevX, bPrevY, bPrevZ;
                if (tPrev >= 4) {
                    const p = getSpiralPosition(tPrev - 4);
                    bPrevX = p.x; bPrevY = p.y; bPrevZ = p.z;
                } else {
                    const thetaPrev = Math.PI / 2 + tPrev * (Math.PI / 2);
                    const rBase = 1.35;
                    bPrevX = rBase * Math.cos(thetaPrev);
                    bPrevY = rBase * Math.sin(thetaPrev);
                    bPrevZ = -0.50;
                }

                let bCurrX, bCurrY, bCurrZ;
                if (tCurr >= 4) {
                    const p = getSpiralPosition(tCurr - 4);
                    bCurrX = p.x; bCurrY = p.y; bCurrZ = p.z;
                } else {
                    const thetaCurr = Math.PI / 2 + tCurr * (Math.PI / 2);
                    const rBase = 1.35;
                    bCurrX = rBase * Math.cos(thetaCurr);
                    bCurrY = rBase * Math.sin(thetaCurr);
                    bCurrZ = -0.50;
                }

                const baseIndex = vertices.length / 3;
                vertices.push(
                    pPrev.x, pPrev.y, pPrev.z,
                    pCurr.x, pCurr.y, pCurr.z,
                    bPrevX, bPrevY, bPrevZ,
                    bCurrX, bCurrY, bCurrZ
                );
                indices.push(
                    baseIndex + 0, baseIndex + 2, baseIndex + 1,
                    baseIndex + 1, baseIndex + 2, baseIndex + 3
                );
            }

            wallGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertices), 3));
            wallGeometry.setIndex(indices);
            wallGeometry.computeVertexNormals();
            wallGeometry.attributes.position.needsUpdate = true;
            if (wallGeometry.index) wallGeometry.index.needsUpdate = true;
        }

        // =========================================================================
        // SECTION 8: RESILIENT MULTI-TIER IMAGE RESOLVER & PERMANENT TEXTURE CACHE
        // Sourced from Google Drive thumbnail CDN, direct CDN, local files & canonical map
        // Guaranteed actual Siddham Image (no fallback text on repeating nodes!)
        // =========================================================================
        function extractGoogleDriveFileId(rawUrl) {
            if (!rawUrl || typeof rawUrl !== 'string') return null;
            rawUrl = rawUrl.trim();
            const match = rawUrl.match(/\/file\/d\/([a-zA-Z0-9_-]{20,})/) ||
                          rawUrl.match(/id=([a-zA-Z0-9_-]{20,})/) ||
                          rawUrl.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
            return match ? match[1] : null;
        }

        function formatImageUrl(rawUrl, id) {
            if (id && id.startsWith('A')) return '06_LA_Gold.PNG';
            if (!rawUrl || typeof rawUrl !== 'string') {
                return canonicalSiddhamFiles[id] || `${id}.png`;
            }
            rawUrl = rawUrl.trim();
            const fileId = extractGoogleDriveFileId(rawUrl);
            if (fileId) {
                return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
            }
            return rawUrl;
        }

        // Color name lookup dictionary for C2 3D Model color specifications
        const C2_COLOR_PALETTE = {
            'gold': 0xffd700, 'golden': 0xffd700, 'yellow': 0xffe600,
            'white': 0xffffff, 'silver': 0xe0e6ed, 'crystal': 0xffffff,
            'blue': 0x00c8ff, 'cyan': 0x00e5ff, 'azure': 0x0099ff, 'sky': 0x70d6ff,
            'red': 0xff3355, 'crimson': 0xdc143c, 'ruby': 0xe0115f,
            'purple': 0xbb44ff, 'violet': 0x9933ff, 'magenta': 0xff00cc,
            'green': 0x00ff88, 'emerald': 0x50c878, 'jade': 0x00a86b,
            'orange': 0xff8800, 'amber': 0xffaa00, 'copper': 0xb87333,
            'pink': 0xff77aa, 'rose': 0xff007f
        };

        function parseC2ModelSpec(c2Str) {
            if (!c2Str || typeof c2Str !== 'string') {
                return { filename: '', color: null, colorName: '' };
            }

            let s = c2Str.trim().replace(/^[\"\']+|[\"\']+$/g, '');
            if (!s) return { filename: '', color: null, colorName: '' };

            const parts = s.split(/[;,|]/).map(p => p.trim()).filter(Boolean);
            let foundColor = null;
            let foundColorName = '';
            let fileCandidate = '';

            for (const p of parts) {
                const hexMatch = p.match(/#(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b|0x[0-9a-fA-F]{6}\b/);
                if (hexMatch) {
                    const hexStr = hexMatch[0].replace('#', '0x');
                    foundColor = parseInt(hexStr, 16);
                    foundColorName = hexMatch[0];
                    continue;
                }

                const lower = p.toLowerCase();
                if (C2_COLOR_PALETTE[lower] !== undefined) {
                    foundColor = C2_COLOR_PALETTE[lower];
                    foundColorName = p;
                    continue;
                }

                if (/\.(glb|gltf|obj)\b/i.test(p)) {
                    fileCandidate = p;
                } else if (!fileCandidate) {
                    fileCandidate = p;
                }
            }

            if (!fileCandidate && parts.length > 0 && !foundColor) {
                fileCandidate = parts[0];
            }

            if (fileCandidate) {
                const words = fileCandidate.split(/\s+/);
                const cleanWords = [];
                for (const w of words) {
                    const wl = w.toLowerCase();
                    if (C2_COLOR_PALETTE[wl] !== undefined && !foundColor) {
                        foundColor = C2_COLOR_PALETTE[wl];
                        foundColorName = w;
                    } else if (/#(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{3})|0x[0-9a-fA-F]{6}/.test(w) && !foundColor) {
                        const m = w.match(/#(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{3})|0x[0-9a-fA-F]{6}/);
                        foundColor = parseInt(m[0].replace('#', '0x'), 16);
                        foundColorName = m[0];
                    } else {
                        cleanWords.push(w);
                    }
                }
                fileCandidate = cleanWords.join(' ').trim();
            }

            return {
                filename: fileCandidate,
                color: foundColor,
                colorName: foundColorName
            };
        }

        const model3DCache = new Map();

        async function loadNode3DModel(spec) {
            if (!spec || !spec.filename) return null;
            const filename = spec.filename.trim();
            const colorHex = spec.color !== null ? spec.color : null;
            const cacheKey = `${filename}_${colorHex}`;

            if (model3DCache.has(cacheKey)) {
                return model3DCache.get(cacheKey).clone(true);
            }

            // Exclusively local file fallback paths (no Google Drive)
            const localCandidates = [
                filename,
                './' + filename,
                filename.endsWith('.glb') ? filename : filename + '.glb'
            ];

            const loader = new THREE.GLTFLoader();

            for (const path of localCandidates) {
                try {
                    const gltf = await new Promise((resolve, reject) => {
                        loader.load(path, resolve, undefined, reject);
                    });
                    if (gltf && gltf.scene) {
                        const sceneObj = gltf.scene;

                        // Fit 3D model comfortably inside the crystal sphere
                        const box = new THREE.Box3().setFromObject(sceneObj);
                        const size = new THREE.Vector3();
                        box.getSize(size);
                        const maxDim = Math.max(size.x, size.y, size.z) || 1.0;
                        const targetScale = 0.24 / maxDim;
                        sceneObj.scale.setScalar(targetScale);

                        const center = new THREE.Vector3();
                        box.getCenter(center);
                        sceneObj.position.sub(center.multiplyScalar(targetScale));

                        // Apply color material if specified in C2 3D Model column
                        sceneObj.traverse((node) => {
                            if (node.isMesh) {
                                node.renderOrder = 11;
                                if (colorHex !== null) {
                                    node.material = new THREE.MeshStandardMaterial({
                                        color: colorHex,
                                        emissive: colorHex,
                                        emissiveIntensity: 0.25,
                                        roughness: 0.25,
                                        metalness: 0.65,
                                        depthWrite: false
                                    });
                                } else if (node.material) {
                                    node.material.depthWrite = false;
                                }
                            }
                        });

                        model3DCache.set(cacheKey, sceneObj);
                        return sceneObj.clone(true);
                    }
                } catch (e) {
                    // Try next local candidate
                }
            }
            return null;
        }

        function buildCandidateUrls(rawUrl, id) {
            const list = [];
            const isGroupA = id && id.startsWith('A');

            if (isGroupA) {
                list.push('06_LA_Gold.PNG');
                list.push('06_LA_Gold.png');
                list.push('./06_LA_Gold.PNG');
            }

            if (rawUrl && typeof rawUrl === 'string') {
                const trimmed = rawUrl.trim();
                const fileId = extractGoogleDriveFileId(trimmed);
                if (fileId) {
                    list.push(`https://lh3.googleusercontent.com/d/${fileId}=w1000`);
                    list.push(`https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`);
                    list.push(`https://wsrv.nl/?url=https%3A%2F%2Fdrive.google.com%2Fthumbnail%3Fid%3D${fileId}%26sz%3Dw1000&output=png`);
                } else if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
                    list.push(trimmed);
                    list.push(`https://wsrv.nl/?url=${encodeURIComponent(trimmed)}&output=png`);
                } else {
                    list.push(trimmed);
                    list.push('./' + trimmed);
                }
            }

            if (id && canonicalSiddhamFiles[id]) {
                const canon = canonicalSiddhamFiles[id];
                list.push(canon);
                list.push('./' + canon);
                if (canon.endsWith('.png')) list.push(canon.replace(/\.png$/i, '.PNG'));
                if (canon.endsWith('.PNG')) list.push(canon.replace(/\.PNG$/i, '.png'));
            }

            if (id) {
                list.push(`${id}.png`);
                list.push(`${id}.PNG`);
            }

            return [...new Set(list)];
        }

const SIDDHAM_FILE_CANDIDATES = {
  SCA: ['40_SHCA_Gold.PNG', encodeURI('40_SHCA_Gold.PNG'), '40_ŚCA_Gold.PNG', encodeURI('40_ŚCA_Gold.PNG'), '40_SCA_Gold.PNG', encodeURI('40_SCA_Gold.PNG')],
  BA:  ['08_BA_Gold.PNG', encodeURI('08_BA_Gold.PNG')],
  DA:  ['07_DA_Gold.PNG', encodeURI('07_DA_Gold.PNG')],
  YA:  ['13_YA_Gold.PNG', encodeURI('13_YA_Gold.PNG')],
  SA:  ['16_SA_Gold.PNG', encodeURI('16_SA_Gold.PNG')],
  VA:  ['11_VA_Gold.PNG', encodeURI('11_VA_Gold.PNG')]
};
const siddhamFileTextureCache = {};
function loadSiddhamFileTexture(key){
  if (siddhamFileTextureCache[key]) return siddhamFileTextureCache[key];
  const candidates = SIDDHAM_FILE_CANDIDATES[key] || [];
  const loader = new THREE.TextureLoader();
  const tryIndex = (idx) => {
    if (idx >= candidates.length) return Promise.reject(new Error(`Siddham glyph "${key}" failed to load from all sources`));
    const url = candidates[idx];
    return new Promise((resolve, reject) => {
      loader.load(url,
        (tex) => resolve(tex),
        undefined,
        (err) => { console.warn(`Siddham glyph "${key}" source failed: ${url}`, err); reject(err); });
    }).catch(() => tryIndex(idx + 1));
  };
  siddhamFileTextureCache[key] = tryIndex(0).then((tex) => {
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
    const img = tex.image;
    const aspect = (img && img.width && img.height) ? (img.width / img.height) : 1;
    return { tex, aspect };
  });
  return siddhamFileTextureCache[key];
}


function makeSiddhamSprite(key, worldHeight){
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ transparent:true, opacity:0, depthWrite:false, depthTest:false }));
  sprite.renderOrder = 10;
  sprite.scale.set(worldHeight, worldHeight, 1);
  if (SIDDHAM_FILE_CANDIDATES[key]) {
    loadSiddhamFileTexture(key).then(({ tex, aspect }) => {
      sprite.material.map = tex;
      sprite.material.needsUpdate = true;
      sprite.scale.set(worldHeight*aspect, worldHeight, 1);
    }).catch((err) => {
      console.warn(`Siddham glyph "${key}" could not be loaded from any source; using fallback glyph texture.`, err);
      sprite.material.map = createFallbackGlyphTexture(key, key);
      sprite.material.needsUpdate = true;
    });
  } else {
    sprite.material.map = createFallbackGlyphTexture(key, key);
    sprite.material.needsUpdate = true;
  }
  return sprite;
}

const GLYPH_MARKER_RADIUS = 0.17;
const GLYPH_MARKER_COLOR = 0xffc107;
function makeStandardGlyphMarkerSphere(){
  const color = new THREE.Color(GLYPH_MARKER_COLOR);
  // depthWrite:false -- so this translucent marker sphere never blocks the
  // glyph sprite sitting at its exact center (the sprite itself is also
  // forced to depthTest:false + a high renderOrder wherever it's used).
  const mat = new THREE.MeshPhysicalMaterial({ color, emissive:color, emissiveIntensity:0.5, roughness:0.3, metalness:0.15, transparent:true, opacity:0, depthWrite:false });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(GLYPH_MARKER_RADIUS, 28, 28), mat);
  const light = new THREE.PointLight(color.getHex(), 0, 1.8);
  return { mesh, mat, light };
}

const EGO_FORM_DURATION_SECONDS_DONOR = 1.2;
function buildEgoBubbleObjectAnimation(root, opts){
  const holdOpen = !!(opts && opts.holdOpen);
  const mat = new THREE.MeshPhysicalMaterial({ color:0xffffff, roughness:0.05, metalness:0.1, transmission:0.98, ior:1.52, thickness:0.3, transparent:true, opacity:1.0, side:THREE.DoubleSide, depthWrite:false });
  let geo = createOuterBubbleGeometry(0.001, 40, 28);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 3;
  root.add(mesh);
  let fullyFormed = false;
  return {
    extent: 2.1,
    update(t){
      if (holdOpen && fullyFormed) return; // already fully open & static — stop rebuilding geometry every frame
      let phi;
      if (holdOpen) {
        const p = Math.min(1, t / EGO_FORM_DURATION_SECONDS);
        const eased = p*p*(3-2*p); // smoothstep ease
        phi = Math.max(0.01, eased * Math.PI * 2);
        if (p >= 1) fullyFormed = true;
      } else {
        const u = (Math.sin(t*0.5)*0.5+0.5); // continuous open/close breathing sweep
        phi = Math.max(0.01, u*Math.PI*2);
      }
      mesh.geometry.dispose();
      mesh.geometry = createOuterBubbleGeometry(phi, 40, 28);
    },
    // Explicitly closes the Bubble back down to its near-zero starting
    // sliver and clears the "fullyFormed" latch -- used by looping
    // sequences (e.g. +EGO_SEQUENCE) so the Bubble can fully re-form again
    // from scratch on every loop, instead of permanently staying open
    // forever after its very first formation.
    reset(){
      fullyFormed = false;
      mesh.geometry.dispose();
      mesh.geometry = createOuterBubbleGeometry(0.001, 40, 28);
    },
    dispose(){ root.remove(mesh); mesh.geometry.dispose(); mat.dispose(); }
  };
}

function loadSharedLotusGeometry(){
  if (lotusGeometryLoadPromise) return lotusGeometryLoadPromise;
  if (!sharedSTLLoader) { lotusGeometryLoadPromise = Promise.reject(new Error('STLLoader unavailable')); return lotusGeometryLoadPromise; }
  const tryIndex = (idx) => {
    if (idx >= LOTUS_STL_CANDIDATES.length) return Promise.reject(new Error('Hoa Sen.stl failed to load from all sources'));
    const url = LOTUS_STL_CANDIDATES[idx];
    return new Promise((resolve, reject) => {
      sharedSTLLoader.load(url, (geometry) => resolve(geometry), undefined,
        (err) => { console.warn(`Hoa Sen.stl source failed: ${url}`, err); reject(err); });
    }).catch(() => tryIndex(idx + 1));
  };
  lotusGeometryLoadPromise = tryIndex(0).then((geometry) => {
    geometry.rotateX(LOTUS_STL_ROTATION_X);
    geometry.computeBoundingBox();
    const size = new THREE.Vector3(); geometry.boundingBox.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const scale = LOTUS_TARGET_DIAMETER / maxDim;
    geometry.scale(scale, scale, scale);
    geometry.center();
    geometry.computeVertexNormals();
    return geometry;
  });
  return lotusGeometryLoadPromise;
}

function createLotusFlowerMesh(colorHex){
  const color = new THREE.Color(colorHex);
  const mat = new THREE.MeshPhysicalMaterial({ color, emissive:color, emissiveIntensity:0.22, roughness:0.35, metalness:0.08, side:THREE.DoubleSide, transparent:true, opacity:0.9 });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.001, 6, 6), mat);
  loadSharedLotusGeometry()
    .then((geo) => { mesh.geometry.dispose(); mesh.geometry = geo; })
    .catch((err) => console.warn('Hoa Sen.stl could not be loaded; lotus flowers will remain as placeholder points.', err));
  return { mesh, mat };
}

function buildLotusFlowerGroup(colors){
  const group = new THREE.Group();
  const instances = colors.map((colorHex, i) => {
    const { mesh, mat } = createLotusFlowerMesh(colorHex);
    mesh.rotation.z = (i / colors.length) * Math.PI * 2; // yaw about the scene's vertical (Z) axis
    // Scale/height falloff is relative to layer count so this works
    // equally well for a single-color flower (1 layer) or the richly
    // multi-color merged bloom (12 layers).
    const layerScale = 1 - (i / colors.length) * 0.32;
    mesh.scale.setScalar(layerScale);
    mesh.position.z = i * 0.0018; // tiny vertical stagger to avoid z-fighting between stacked layers
    group.add(mesh);
    return { mat };
  });

  // A multi-color bloom (heart-center merge) gets a golden seed-pod plus a
  // ring of fine upright stamen filaments at its center, like a real lotus,
  // so the layered tints read as one naturally-colored flower with a full
  // floral center rather than flat stacked slices.
  let stamenMat = null, stamen = null, filamentMat = null;
  if (colors.length > 1){
    stamenMat = new THREE.MeshPhysicalMaterial({ color:0xffc107, emissive:0xff9800, emissiveIntensity:0.5, roughness:0.35, metalness:0.4, transparent:true, opacity:0.95 });
    stamen = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), stamenMat);
    stamen.position.z = 0.055;
    group.add(stamen);

    filamentMat = new THREE.MeshStandardMaterial({ color:0xffb300, emissive:0xff9800, emissiveIntensity:0.4, roughness:0.4, metalness:0.3, transparent:true, opacity:0.9 });
    const FIL_COUNT = 18;
    for (let fi=0; fi<FIL_COUNT; fi++){
      const ang = (fi/FIL_COUNT) * Math.PI*2;
      const fr = 0.07;
      const fil = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.006, 0.05, 6), filamentMat);
      fil.position.set(Math.cos(ang)*fr, Math.sin(ang)*fr, 0.05);
      fil.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1));
      group.add(fil);
    }
  }

  function setBloom(progress){
    const p = Math.max(0, Math.min(1, progress));
    const scale = 0.08 + 0.92*p;
    group.scale.setScalar(scale);
    instances.forEach(({ mat }) => { mat.opacity = 0.25 + 0.7*p; });
    if (stamenMat) stamenMat.opacity = 0.2 + 0.75*p;
    if (filamentMat) filamentMat.opacity = (0.2 + 0.75*p) * 0.9;
  }
  setBloom(0);
  return { group, setBloom };
}
